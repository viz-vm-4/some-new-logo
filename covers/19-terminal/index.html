<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printout — Vizuara Books</title>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,100..800&display=block" rel="stylesheet">
<style>
:root{
  --paper:#F1EEE6; --ink:#17171C; --sig:#2B3BD9;
  --cw:6px; --ch:11.1px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#E4E1D9;color:var(--ink)}
body{font-family:'Martian Mono',monospace;font-variation-settings:'wdth' 75}
.covers{display:flex;flex-wrap:wrap;gap:48px;padding:48px}
.cover{width:720px;height:888px;position:relative;overflow:hidden;background:var(--paper);color:var(--ink);flex:none;
  font-family:'Martian Mono',monospace}
.field{position:absolute;inset:0;font-size:10px;font-variation-settings:'wdth' 75}
.field .r{position:absolute;left:0;height:var(--ch);line-height:var(--ch);white-space:pre}
.field span{display:inline-block;vertical-align:top;height:var(--ch);line-height:var(--ch)}
.field .t9,.field .s9{height:calc(var(--ch) + .7px)}
.cap,.foot,.tl,.pr,.lab{position:absolute;white-space:pre}
.tl{font-variation-settings:'wdth' 75,'wght' 800;color:var(--ink);word-spacing:-.28em}
.pr{font-variation-settings:'wdth' 75,'wght' 800;color:var(--sig)}
.cur{position:absolute;background:var(--sig)}
.cap{font-size:10px;line-height:var(--ch);font-variation-settings:'wdth' 75,'wght' 500;color:var(--ink)}
.cap b{font-variation-settings:'wdth' 75,'wght' 800;color:var(--sig)}
.foot{font-size:10px;line-height:var(--ch);font-variation-settings:'wdth' 100,'wght' 600;letter-spacing:.06em;color:var(--ink)}
.foot.im{font-variation-settings:'wdth' 112.5,'wght' 800;letter-spacing:.14em}
.foot b{color:var(--sig);font-variation-settings:'wdth' 100,'wght' 800}
</style>
</head><body>
<div class="covers" id="covers"></div>
<script>
// ─── grid ────────────────────────────────────────────────────────────────
const COLS=120, ROWS=80, CW=6, CH=888/80, FR=51;
const PAPER=[241,238,230], INK=[23,23,28], SIG=[43,59,217];
const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';
(function(){
  const css=[];
  const wts=[300,300,360,420,500,580,660,740,800];
  const ink=[.16,.30,.40,.50,.60,.70,.82,.92,1];
  for(let i=0;i<9;i++){
    css.push(`.t${i}{color:${mix(PAPER,INK,ink[i])};font-variation-settings:'wdth' 75,'wght' ${wts[i]}}`);
    css.push(`.s${i}{color:${mix(PAPER,SIG,Math.max(.4,ink[i]))};font-variation-settings:'wdth' 75,'wght' ${wts[i]}}`);
  }
  css.push(`.t9{background:${mix(PAPER,INK,1)};color:${mix(PAPER,PAPER,0)};font-variation-settings:'wdth' 75,'wght' 560}`);
  css.push(`.s9{background:${mix(PAPER,SIG,1)};color:${mix(PAPER,PAPER,0)};font-variation-settings:'wdth' 75,'wght' 560}`);
  const st=document.createElement('style'); st.textContent=css.join('\n'); document.head.appendChild(st);
})();
function Grid(){
  this.c=[]; for(let r=0;r<ROWS;r++){const row=[];for(let c=0;c<COLS;c++)row.push({ch:' ',t:-1,s:0});this.c.push(row);}
}
Grid.prototype.put=function(r,c,ch,t,s=0){ if(r<0||r>=ROWS||c<0||c>=COLS)return; const q=this.c[r][c]; q.ch=ch; q.t=t; q.s=s; };
Grid.prototype.text=function(r,c,str,t,s=0){ for(let i=0;i<str.length;i++) this.put(r,c+i,str[i],t,s); };
Grid.prototype.fill=function(r0,c0,r1,c1,ch=' ',t=-1,s=0){ for(let r=r0;r<r1;r++)for(let c=c0;c<c1;c++)this.put(r,c,ch,t,s); };
Grid.prototype.get=function(r,c){ return (r<0||r>=ROWS||c<0||c>=COLS)?null:this.c[r][c]; };
Grid.prototype.cls=function(q){
  if(q.t<0) return 'x';
  const i = q.t>=.86?9: q.t<.08?0: 1+Math.min(7,Math.floor((q.t-.08)/(.78/8)));
  return (q.s?'s':'t')+i;
};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
Grid.prototype.html=function(){
  let out='';
  for(let r=0;r<ROWS;r++){
    let row='',run='',cls=null,any=false;
    for(let c=0;c<COLS;c++){
      const q=this.c[r][c], k=this.cls(q);
      if(k!=='x') any=true;
      if(k!==cls){ if(run) row+=`<span class="${cls}">${esc(run)}</span>`; run=''; cls=k; }
      run+=q.ch;
    }
    if(run) row+=`<span class="${cls}">${esc(run)}</span>`;
    if(any) out+=`<div class="r" style="top:${(r*CH).toFixed(2)}px">${row}</div>`;
  }
  return out;
};
// ─── helpers ─────────────────────────────────────────────────────────────
function rng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function gauss(R){ let u=0,v=0; while(!u)u=R(); v=R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function segd(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1);t=clamp(t);return Math.hypot(ax+t*dx-px,ay+t*dy-py);}
function catmull(pts,n=12){ // smooth polyline through points
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
      out.push([0,1].map(d=>.5*((2*p1[d])+(-p0[d]+p2[d])*t+(2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*t2+(-p0[d]+3*p1[d]-3*p2[d]+p3[d])*t3)));}
  }
  out.push(pts[pts.length-1]); return out;
}

// ─── emblems: each fills rows 0..FR-1 with its own data ─────────────────
const EMBLEM={};

// Causal self-attention, quantised to one digit per weight
EMBLEM['build-llms-from-scratch']=function(g){
  const toks=('<bos>|a|lang|uage|model|reads|the|tokens|that|came|before|and|pred|icts|the|one|that|comes|next|.|it|learns|this|from|text|,|one|token|at|a|time|,|until|the|pattern|s|of|lang|uage|live|in|its|weights|.|then|it|writes|,|token|by|token').split('|');
  const N=Math.min(toks.length,FR), C0=12, R=rng(11);
  const key=new Set([4,7,12,17,24,27,34,42]);
  for(let i=0;i<N;i++){
    g.text(i,0,toks[i].padStart(10,' ')+' ',.62);
    const lg=[];
    for(let j=0;j<=i;j++) lg.push(2.3*Math.exp(-(i-j)/1.8)+(j===0?2.4:0)+(key.has(j)?1.1:0)+.45*gauss(R));
    const m=Math.max(...lg), ex=lg.map(v=>Math.exp(v-m)), s=ex.reduce((a,b)=>a+b,0);
    const mx=Math.max(...ex);
    for(let j=0;j<N;j++){
      const c=C0+2*j;
      if(j>i){ g.text(i,c,(i+j)%2?'  ':'· ',.05); continue; }
      const d=Math.round(9*ex[j]/mx);
      if(j===i){ g.text(i,c,d+' ',.95,1); continue; }
      g.text(i,c,d+' ', d>=6?.95: d===0?.48:.55+d*.06);
    }
    for(let c=C0+2*N;c<COLS;c++) g.put(i,c,(i+c)%2?' ':'·',.04);
  }
  return {cap:['attn','= softmax(q @ k.T / sqrt(d) + causal_mask)   # row-max = 9']};
};

// Hex dump of a handwritten seven, and the network's answer
EMBLEM['neural-networks-from-scratch']=function(g){
  const PX=40, PY=FR; // pixels: 3 cols x 1 row each
  const W=PX*18, H=PY*CH; // physical px
  const stroke=catmull([[150,86],[250,78],[350,70],[430,70],[415,120],[375,200],[330,290],[295,380],[270,470],[258,520]].map(([x,y])=>[x,y]),10);
  const bar=[[215,300],[400,292]];
  for(let y=0;y<PY;y++)for(let x=0;x<PX;x++){
    const px=(x+.5)*18, py=(y+.5)*CH;
    let d=1e9; for(let i=0;i<stroke.length-1;i++) d=Math.min(d,segd(px,py,...stroke[i],...stroke[i+1]));
    const v=clamp((46-d)/26);
    const b=Math.round(v*255), hx=b.toString(16).padStart(2,'0');
    const t = b===0? .02 : b>=240? .95 : .30+(b/255)*.55;
    g.text(y,x*3,hx+' ',t);
  }
  // softmax output
  const P=[.004,.012,.021,.018,.009,.006,.002,.874,.031,.023];
  const pc=86, pr=14;
  g.fill(pr-2,pc-2,pr+21,COLS,' ',-1);
  for(let k=0;k<10;k++){
    const r=pr+k*2, on=k===7;
    g.text(r,pc,String(k),on?.95:.8,on?1:0);
    const L=Math.max(1,Math.round(P[k]*24));
    for(let i=0;i<L;i++) g.put(r,pc+2+i,on?' ':'=',on?.95:.7,on?1:0);
    g.text(r,pc+3+L,P[k].toFixed(3),on?.8:.55,on?1:0);
  }
  return {cap:['p','= softmax(W2 @ relu(W1 @ (img / 255)))   # -> 7']};
};

// Histogram of N(0,1) samples; every sample printed in its bin
EMBLEM['mathematical-foundations-for-ml']=function(g){
  const R=rng(5), n=420, xs=[];
  for(let i=0;i<n;i++) xs.push(gauss(R));
  const B=20, lo=-2.5, bw=5/B, bins=Array.from({length:B},()=>[]);
  xs.forEach(x=>{const k=Math.floor((x-lo)/bw); if(k>=0&&k<B) bins[k].push(x);});
  // background: plotting grid
  for(let r=0;r<FR;r++)for(let c=0;c<COLS;c++){
    const ch = (c%6===0 && r%2===0)?'·':' ';
    g.put(r,c,ch,.05);
  }
  const base=FR-3;
  bins.forEach((b,k)=>{
    b.sort((a,b)=>a-b);
    b.forEach((x,i)=>{
      const r=base-1-i; if(r<0) return;
      const s=(x<0?'-':'+')+Math.abs(x).toFixed(2);
      g.text(r,k*6,s+' ',.95);
    });
  });
  // axis
  for(let c=0;c<COLS;c++) g.put(base,c,c%6===0?'+':'-',.8);
  for(let k=0;k<=B;k+=2){ const v=lo+k*bw; const s=(v>0?'+':'')+v.toFixed(1); g.text(base+1,Math.max(0,k*6-1),s,.7); }
  // pdf curve
  const pts=[];
  for(let c=0;c<COLS;c++){
    const x=lo+(c+.5)/6*bw, pdf=Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
    const h=pdf*n*bw; pts.push(base-1-h);
  }
  for(let c=0;c<COLS;c++){ const r=Math.round(pts[c])-1; if(r<0||r>=base) continue; const q=g.get(r,c);
    if(q.t>=.86){ q.s=1; } else g.put(r,c,'*',.95,1); }
  return {cap:['x','= np.random.randn(420); hist(x, bins=20)   * = N(0, 1)']};
};

// ─── books ───────────────────────────────────────────────────────────────
const BOOKS=[
  {slug:'build-llms-from-scratch', level:'intermediate', meta:'20 capsules · 6 h',
   title:[['Build Large','Language Models','(LLMs) from Scratch'],5]},
  {slug:'neural-networks-from-scratch', level:'beginner', meta:'33 capsules · 7 h',
   title:[['Neural Networks','from Scratch'],6]},
  {slug:'mathematical-foundations-for-ml', level:'beginner', meta:'43 capsules · 10 h',
   title:[['Mathematical','Foundations for','Machine Learning'],5]},
];
const PROMPT={beginner:'>',intermediate:'$',advanced:'#'};

function build(b){
  const g=new Grid();
  const el=document.createElement('div'); el.className='cover'; el.dataset.slug=b.slug;
  const info=EMBLEM[b.slug](g)||{};
  const parts=[];
  const M=6, T0=56;
  const [lines,k]=b.title, TX=M+2*k;
  lines.forEach((ln,i)=>{
    const r=T0+i*k;
    parts.push(`<div class="tl" style="left:${TX*CW}px;top:${(r*CH).toFixed(1)}px;font-size:${k*10}px;line-height:${(k*CH).toFixed(1)}px">${esc(ln)}</div>`);
  });
  parts.push(`<div class="pr" style="left:${M*CW}px;top:${(T0*CH).toFixed(1)}px;font-size:${k*10}px;line-height:${(k*CH).toFixed(1)}px">${esc(PROMPT[b.level])}</div>`);
  // cursor: measured after fonts load
  parts.push(`<div class="cur" data-k="${k}"></div>`);
  if(info.cap) parts.push(`<div class="cap" style="left:${M*CW}px;top:${(52.5*CH).toFixed(1)}px"><b>${esc(info.cap[0])}</b> ${esc(info.cap[1])}</div>`);
  parts.push(`<div class="foot im" style="left:${M*CW}px;top:${(76*CH).toFixed(1)}px">VIZUARA BOOKS</div>`);
  parts.push(`<div class="foot" style="right:${M*CW}px;top:${(76*CH).toFixed(1)}px"><b>${esc(PROMPT[b.level])}</b> ${b.level.toUpperCase()}  ·  ${esc(b.meta.toUpperCase())}</div>`);
  el.innerHTML=`<div class="field">${g.html()}</div>`+parts.join('');
  return el;
}
const host=document.getElementById('covers');
for(const b of BOOKS) host.appendChild(build(b));
// place cursors after the last title line, using real glyph metrics
document.fonts.ready.then(()=>{
  document.querySelectorAll('.cover').forEach(cv=>{
    const tls=cv.querySelectorAll('.tl'), last=tls[tls.length-1], cur=cv.querySelector('.cur');
    const k=+cur.dataset.k, fs=k*10;
    const x=last.offsetLeft+last.getBoundingClientRect().width;
    const lh=k*CH, top=last.offsetTop;
    cur.style.left=(x+fs*.18).toFixed(1)+'px';
    cur.style.width=(fs*.5).toFixed(1)+'px';
    cur.style.top=(top+lh/2-fs*.36).toFixed(1)+'px';
    cur.style.height=(fs*.74).toFixed(1)+'px';
  });
});
</script>
</body></html>
