<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interchange — a cover system for Vizuara Books</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&display=block">
<style>
:root{ --paper:#F3EFE6; --ink:#16181B; --ink2:#4B4D51; --tint:#E3DDCF; --tint2:#D6CEBC; --water:#D0DEE3; --grey:#C4BCAC; }
*{box-sizing:border-box}
html,body{margin:0;background:#DEDAD0;color:#16181B}
body{font-family:Overpass, system-ui, sans-serif;-webkit-font-smoothing:antialiased}

/* ───────── COVER ───────── */
.cover{position:relative;width:720px;height:888px;overflow:hidden;background:var(--paper);color:var(--ink);flex:0 0 720px}
.cover.night{--paper:#15181D;--ink:#EEEAE0;--ink2:#A6A8AB;--tint:#21262D;--tint2:#2A3038;--water:#1C2B34;--grey:#3A4049}
.cover .map{position:absolute;left:0;top:0;width:720px;height:888px;overflow:visible}
.cover .hdr{position:absolute;left:40px;right:40px;top:33px;height:20px;display:flex;justify-content:space-between;align-items:center;
  font:700 10.5px/1 Overpass;letter-spacing:.13em;text-transform:uppercase}
.cover .hdr .lvl{display:flex;align-items:center;gap:8px}
.cover .hdr .lvl svg{display:block;margin-top:-2px}
.cover .hrule{position:absolute;left:40px;right:40px;top:58px;height:3px;background:var(--ink)}
.cover .title{position:absolute;left:37px;right:36px;top:84px;font-weight:800;letter-spacing:-.024em;line-height:.955;
  font-size:var(--ts,60px);font-kerning:normal}
.cover .tag{font-family:Newsreader, Georgia, serif;font-style:italic;font-weight:400;font-size:19.5px;line-height:1.28;letter-spacing:0;
  margin:15px 0 0 3px;max-width:540px}
.cover .foot{position:absolute;left:40px;right:40px;bottom:30px}
.cover .frule{height:1.5px;background:var(--ink);margin-bottom:11px}
.cover .key{display:grid;grid-template-columns:1fr 1fr;column-gap:30px;row-gap:5px;
  font:700 8.8px/1.1 Overpass;letter-spacing:.05em;text-transform:uppercase}
.cover .key .k{display:flex;align-items:center;gap:7px;min-width:0}
.cover .key .k b{flex:0 0 15px;height:15px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;
  font:800 9px/1 Overpass;letter-spacing:0;padding-top:1.5px}
.cover .key .k span{white-space:nowrap;overflow:hidden}
.cover .key .k i{font-style:normal;font-weight:600;margin-left:auto;padding-left:6px;color:var(--ink2);letter-spacing:.04em}
.cover .imprint{display:flex;justify-content:space-between;align-items:center;margin-top:13px}
.cover .stats{font:700 10px/1 Overpass;letter-spacing:.12em;text-transform:uppercase}
.cover .brand{display:flex;align-items:center;gap:9px;font:800 12px/1 Overpass;letter-spacing:.17em;text-transform:uppercase}
.cover .brand svg{display:block}

/* map text */
.sn{font:700 8.4px Overpass;fill:var(--ink)}
.bl{font:800 10px Overpass;fill:#fff}
.tl{font:italic 400 14px Newsreader;fill:var(--ink2);letter-spacing:.06em}
.lb{font:800 9.5px Overpass;fill:var(--ink);letter-spacing:.08em}
.trk{font:800 10.5px Overpass;fill:var(--ink);letter-spacing:.14em}
.dest{font:800 9px Overpass;fill:var(--ink);letter-spacing:.1em}
.mt{font:italic 400 22px Newsreader;fill:var(--ink)}
.stn{font:800 9.5px Overpass;fill:var(--ink);letter-spacing:.1em}
.cell{opacity:.75}
.cover .sbul{position:absolute;right:40px;top:86px;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font:800 23px/1 Overpass;letter-spacing:.02em;padding-top:3px}
.cover .key .k b.hollow{background:transparent !important;border:2.6px solid var(--kc);}

/* ───────── PAGE ───────── */
.page{width:1560px;margin:0 auto;padding:70px 60px 120px}
.covers{display:grid;grid-template-columns:720px 720px;gap:80px 0;justify-content:space-between}
.cap{font:400 13px/1.45 Newsreader, Georgia, serif;margin-top:14px;color:#2a2c30;max-width:700px}
.cap b{font:800 10.5px/1 Overpass;letter-spacing:.12em;text-transform:uppercase;margin-right:8px}
</style>
</head>

   Vocabulary (fixed across the library):
     line   = a part of the book (colour = part order)
     tick   = one capsule (a station)
     ring   = a capsule where lines meet (interchange)
     pill   = an interchange complex spanning parallel lines
     bullet = route bullet with the part number, at a terminus
     tint / water = the territory: the subject's own geography
   ============================================================ */
const LINES = ['#D8432E','#1F4E9C','#12875A','#E9A31B','#6C3F99','#8C5A2E','#0D7F89','#8DAA2A','#C2577A','#6F767D'];
const LINES_NIGHT = ['#E8563F','#4A7DD6','#23A676','#F0B232','#9467CE','#BC8552','#1AA3AE','#A8C63D','#DC7096','#9CA3AA'];
const W = 8, TICK = 5.5, R = 18, NS = 'http://www.w3.org/2000/svg';

const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], add=(a,b)=>[a[0]+b[0],a[1]+b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const len=a=>Math.hypot(a[0],a[1]), norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l]};
const leftN=d=>[d[1],-d[0]];
const f=x=>Math.round(x*100)/100;

function offsetPts(pts,d){
  if(!d) return pts.map(p=>p.slice());
  const out=[];
  for(let i=0;i<pts.length;i++){
    const nPrev = i>0 ? leftN(norm(sub(pts[i],pts[i-1]))) : null;
    const nNext = i<pts.length-1 ? leftN(norm(sub(pts[i+1],pts[i]))) : null;
    if(!nPrev) out.push(add(pts[i],mul(nNext,d)));
    else if(!nNext) out.push(add(pts[i],mul(nPrev,d)));
    else { const s=[nPrev[0]+nNext[0],nPrev[1]+nNext[1]]; const k=d/(1+nPrev[0]*nNext[0]+nPrev[1]*nNext[1]); out.push(add(pts[i],mul(s,k))); }
  }
  return out;
}
function roundPath(pts, r, off=0){
  const segs=[]; let cur=pts[0]; let dstr=`M${f(cur[0])},${f(cur[1])}`;
  const radii = Array.isArray(r) ? r : null;
  for(let i=1;i<pts.length;i++){
    const P=pts[i];
    if(i<pts.length-1){
      const u=norm(sub(P,pts[i-1])), v=norm(sub(pts[i+1],P));
      const cross=u[0]*v[1]-u[1]*v[0], dot=u[0]*v[0]+u[1]*v[1];
      const th=Math.acos(Math.max(-1,Math.min(1,dot)));
      if(th<1e-3){ pushL(P); continue; }
      let rr = (radii? radii[i] : r) + (cross>0 ? off : -off);
      rr=Math.max(2,rr);
      let t=rr*Math.tan(th/2);
      const lim=Math.min(len(sub(P,cur)), len(sub(pts[i+1],P))*0.5);
      if(t>lim){ t=lim; rr=t/Math.tan(th/2); }
      const A=sub(P,mul(u,t)), B=add(P,mul(v,t));
      pushL(A);
      const n = cross>0 ? [-u[1],u[0]] : [u[1],-u[0]];
      const C=add(A,mul(n,rr));
      const a0=Math.atan2(A[1]-C[1],A[0]-C[0]);
      const sgn= cross>0?1:-1;
      segs.push({t:'A',C,r:rr,a0,th,sgn,len:rr*th,from:A,to:B});
      dstr+=` A${f(rr)},${f(rr)} 0 0 ${cross>0?1:0} ${f(B[0])},${f(B[1])}`;
      cur=B;
    } else pushL(P);
  }
  function pushL(P){ const l=len(sub(P,cur)); if(l>1e-6){ segs.push({t:'L',a:cur,b:P,len:l,dir:norm(sub(P,cur))}); dstr+=` L${f(P[0])},${f(P[1])}`; } cur=P; }
  const total=segs.reduce((s,g)=>s+g.len,0);
  return {d:dstr,segs,total,pts};
}
function pointAt(path,s){
  if(!path.segs.length) return {p:path.pts[0],d:[1,0],seg:null};
  s=Math.max(0,Math.min(path.total,s));
  for(const g of path.segs){
    if(s<=g.len+1e-6){
      if(g.t==='L'){ return {p:add(g.a,mul(g.dir,s)),d:g.dir,seg:g}; }
      const a=g.a0+g.sgn*(s/g.r); const p=[g.C[0]+g.r*Math.cos(a),g.C[1]+g.r*Math.sin(a)];
      const d = g.sgn>0 ? [-Math.sin(a),Math.cos(a)] : [Math.sin(a),-Math.cos(a)];
      return {p,d,seg:g};
    }
    s-=g.len;
  }
  const g=path.segs[path.segs.length-1];
  return g.t==='L'?{p:g.b,d:g.dir,seg:g}:{p:g.to,d:[0,0],seg:g};
}
function orient(d){ const ax=Math.abs(d[0]), ay=Math.abs(d[1]); if(ay<0.05) return 'h'; if(ax<0.05) return 'v'; return 'd'; }

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs){if(attrs[k]!==''&&attrs[k]!=null)e.setAttribute(k,attrs[k]);}if(parent)parent.appendChild(e);return e;}

/* ------------------------------------------------------------ */
function makeMap(svg, book, slug){
  const defs=el('defs',{},svg);
  const pat=el('pattern',{id:'hatch-'+slug,width:9,height:9,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);
  el('rect',{x:0,y:0,width:9,height:9,fill:'var(--tint)'},pat);
  el('line',{x1:0,y1:0,x2:0,y2:9,stroke:'var(--tint2)','stroke-width':3.2},pat);
  const frame=el('g',{class:'frame'},svg);
  const L={terr:el('g',{},frame), ctx:el('g',{},frame), lines:el('g',{},frame), ticks:el('g',{},frame), rings:el('g',{},frame), labels:el('g',{},frame)};
  const parts=book.parts||[];
  const first=[]; let acc=1; parts.forEach(p=>{first.push(acc);acc+=p[2];});
  const used=parts.map(()=>0);
  const col = i => (book.colors ? book.colors[i%book.colors.length] : LINES[i%LINES.length]);
  const stations=[]; // for audit
  const M = {
    frame, L, col, stations, hatch:`url(#hatch-${slug})`,
    /* one run of a line */
    line(part, pts, o={}){
      const P=offsetPts(pts,o.off||0), path=roundPath(P,o.r??R,o.off||0);
      const color=o.color||col(part), w=o.w||W;
      if(o.hollow){
        el('path',{d:path.d,fill:'none',stroke:color,'stroke-width':w,'stroke-linecap':'butt','stroke-linejoin':'round'},L.lines);
        el('path',{d:path.d,fill:'none',stroke:'var(--paper)','stroke-width':w-4.2,'stroke-linecap':'butt','stroke-linejoin':'round'},L.lines);
      } else el('path',{d:path.d,fill:'none',stroke:color,'stroke-width':w,'stroke-linecap':'butt','stroke-linejoin':'round','stroke-dasharray':o.dash||''},o.layer?L[o.layer]:L.lines);
      if(o.ctx) return path;                       // context line (no stations)
      const total=parts[part][2];
      const n = o.n ?? (total-used[part]);
      const ends=o.ends||'none';
      // allowed arc-length intervals
      const step=1, allowed=[]; let open=null;
      for(let s=0;s<=path.total+1e-6;s+=step){
        const {p,d,seg}=pointAt(path,s);
        let ok = true;
        if(o.where){ ok = seg && seg.t==='L' && o.where.includes(orient(d)); }
        if(ok && o.avoid){ for(const r of o.avoid){ if(p[0]>=r[0]&&p[0]<=r[2]&&p[1]>=r[1]&&p[1]<=r[3]){ok=false;break;} } }
        if(ok && o.span){ ok = s>=o.span[0] && s<=path.total-o.span[1]; }
        if(ok){ if(!open) open=[s,s]; else open[1]=s; } else if(open){ allowed.push(open); open=null; }
      }
      if(open) allowed.push(open);
      const A=allowed.reduce((t,iv)=>t+(iv[1]-iv[0]),0);
      const map=u=>{ for(const iv of allowed){ const l=iv[1]-iv[0]; if(u<=l+1e-6) return iv[0]+u; u-=l; } return allowed.length?allowed[allowed.length-1][1]:0; };
      const us=[];
      for(let i=0;i<n;i++){
        let t;
        if(o.at) t=o.at[i];
        else if(n===1) t = ends==='start'?0: ends==='end'?1:0.5;
        else if(ends==='both') t=i/(n-1);
        else if(ends==='end') t=(i+1)/n;
        else if(ends==='start') t=i/n;
        else t=(i+0.5)/n;
        us.push(map(A*t));
      }
      const side=o.side??1;
      us.forEach((s,i)=>{
        const num=first[part]+used[part]+i;
        const {p,d}=pointAt(path,s); const nrm=mul(leftN(d),side);
        const isRing = o.ring==='all' || (o.ring==='end'&&i===n-1) || (o.ring==='start'&&i===0) || (Array.isArray(o.ring)&&o.ring.includes(i));
        const tip = book.caps ? `${String(num).padStart(2,'0')} · ${book.caps[num-1]||''}` : '';
        let e;
        if(isRing) e=M.ring(p[0],p[1],o.ringR);
        else if(o.hollow){ e=el('circle',{cx:f(p[0]),cy:f(p[1]),r:w/2+2.5,fill:'var(--paper)',stroke:color,'stroke-width':2.8},L.rings); }
        else { const b=add(p,mul(nrm,w/2+TICK)); e=el('line',{x1:f(p[0]),y1:f(p[1]),x2:f(b[0]),y2:f(b[1]),stroke:color,'stroke-width':3.6},L.ticks); }
        if(tip){ const t=el('title',{},e); t.textContent=tip; }
        stations.push({part,num,p});
      });
      used[part]+=n;
      // termini
      const T=(where)=>{ const s=where==='start'?0:path.total; const {p,d}=pointAt(path,s); const nn=leftN(d);
        const a=add(p,mul(nn,w/2+TICK)), b=sub(p,mul(nn,w/2+TICK));
        el('line',{x1:f(a[0]),y1:f(a[1]),x2:f(b[0]),y2:f(b[1]),stroke:color,'stroke-width':3.6},L.ticks); };
      if(o.term==='start'||o.term==='both') T('start');
      if(o.term==='end'||o.term==='both') T('end');
      const Arrow=(where)=>{ const s=where==='start'?0:path.total; const {p,d}=pointAt(path,s); const dd=where==='start'?mul(d,-1):d; const nn=leftN(dd);
        const tip=add(p,mul(dd,13)), a=add(p,mul(nn,9)), b=sub(p,mul(nn,9));
        el('path',{d:`M${f(a[0])},${f(a[1])} L${f(tip[0])},${f(tip[1])} L${f(b[0])},${f(b[1])}Z`,fill:color},L.lines); };
      if(o.arrow==='end'||o.arrow==='both') Arrow('end');
      if(o.arrow==='start'||o.arrow==='both') Arrow('start');
      if(o.bullet){
        const bs = o.bullet==='start'?0: o.bullet==='end'?path.total : o.bullet;
        const where = typeof o.bullet==='number' ? 'mid' : o.bullet;
        const {p,d}=pointAt(path,bs); const dd = where==='start'?mul(d,-1):d;
        const q = where==='mid' ? p : add(p,mul(dd,o.bulletGap??15));
        M.bullet(part,q[0],q[1],o.bulletColor);
      }
      return path;
    },
    ring(x,y,rad=6.6){ return el('circle',{cx:f(x),cy:f(y),r:rad,fill:'var(--paper)',stroke:'var(--ink)','stroke-width':2.7},L.rings); },
    pill(x1,y1,x2,y2,rad=7.5){
      const g=el('g',{},L.rings);
      el('line',{x1,y1,x2,y2,stroke:'var(--ink)','stroke-width':rad*2+2.7,'stroke-linecap':'round'},g);
      el('line',{x1,y1,x2,y2,stroke:'var(--paper)','stroke-width':rad*2-2.7,'stroke-linecap':'round'},g);
      return g;
    },
    bullet(part,x,y,color){
      el('circle',{cx:f(x),cy:f(y),r:9.2,fill:color||col(part)},L.labels);
      const t=el('text',{x:f(x), y:f(y+3.7),'text-anchor':'middle',class:'bl'},L.labels); t.textContent=parts[part][0];
    },
    zone(d,o={}){ return el('path',{d,fill:o.fill||'var(--tint)',stroke:o.stroke||'none','stroke-width':o.sw||0,opacity:o.op??''},L.terr); },
    rect(x,y,w,h,rx=0,o={}){ return el('rect',{x:f(x),y:f(y),width:f(w),height:f(h),rx,fill:o.fill||'var(--tint)',stroke:o.stroke||'',"stroke-width":o.sw||'',class:o.cls||''},L.terr); },
    bulletText(txt,x,y,fill,tcol,rad=10.5){
      el('circle',{cx:f(x),cy:f(y),r:rad,fill},L.labels);
      const t=el('text',{x:f(x), y:f(y+3.9),'text-anchor':'middle',class:'bl'},L.labels); t.textContent=txt; t.style.fill=tcol; t.style.fontSize=(txt.length>2?8.5:10)+'px';
    },
    band(pts,wid,o={}){ const p=roundPath(pts,o.r??40); return el('path',{d:p.d,fill:'none',stroke:o.color||'var(--water)','stroke-width':wid,'stroke-linecap':o.cap||'butt','stroke-linejoin':'round'},L.terr); },
    tlabel(txt,x,y,o={}){
      const t=el('text',{x,y,'text-anchor':o.anchor||'middle',class:'tl',transform:o.rot?`rotate(${o.rot} ${x} ${y})`:''},o.top?L.labels:L.terr);
      t.textContent=txt; if(o.size) t.style.fontSize=o.size+'px'; if(o.ls!=null) t.style.letterSpacing=o.ls; if(o.fill) t.style.fill=o.fill; return t;
    },
    label(txt,x,y,o={}){ const t=el('text',{x,y,'text-anchor':o.anchor||'start',class:o.cls||'lb',transform:o.rot?`rotate(${o.rot} ${x} ${y})`:''},L.labels); t.textContent=txt; if(o.fill) t.style.fill=o.fill; return t; },
    math(txt,x,y,o={}){ const t=el('text',{x:f(x),y:f(y),'text-anchor':o.anchor||'middle',class:'mt'},L.labels); t.textContent=txt; if(o.fill) t.style.fill=o.fill; if(o.size) t.style.fontSize=o.size+'px'; return t; },
    claim(part,n,kind){ for(let i=0;i<n;i++) stations.push({part,num:first[part]+used[part]+i,kind}); used[part]+=n; },
    parts(){ return parts; },
    audit(){ return parts.map((p,i)=>[p[2],used[i]]); }
  };
  return M;
}
/* ============================================================
   MAPS — one per book. Local frame: x 0–640 (cover x 40–680),
   y 0–h. Lines may bleed past x<0 / x>640 to the trim.
   ============================================================ */
const MAPS = {};
const OUT = [-80,-1e4,24,1e4];            // keep stations out of the left bleed / bullet zone
const OUTR = [624,-1e4,1e4,1e4];          // and the right bleed

/* polyline helpers: cut a route into parts by arc length, keeping cuts off corners */
function polyCum(pts){ const c=[0]; for(let i=1;i<pts.length;i++) c.push(c[i-1]+len(sub(pts[i],pts[i-1]))); return c; }
function polyAt(pts,cum,s){ for(let i=1;i<pts.length;i++) if(s<=cum[i]+1e-9){ const t=(s-cum[i-1])/((cum[i]-cum[i-1])||1); return {p:add(pts[i-1],mul(sub(pts[i],pts[i-1]),t)),i}; } return {p:pts[pts.length-1],i:pts.length-1}; }
function cutPoly(pts,cuts,m=28){
  const cum=polyCum(pts), out=[]; let sp=pts[0], si=1;
  for(let c of cuts){
    for(let k=0;k<30;k++){ const {i}=polyAt(pts,cum,c); const a=c-cum[i-1], b=cum[i]-c, L=cum[i]-cum[i-1];
      if(L<2*m){ c=(cum[i-1]+cum[i])/2; break; } if(a>=m&&b>=m) break; c += a<m ? (m-a+0.5) : -(m-b+0.5); }
    const q=polyAt(pts,cum,c); const pc=[sp]; for(let i=si;i<q.i;i++) pc.push(pts[i]); pc.push(q.p); out.push(pc); sp=q.p; si=q.i;
  }
  const pc=[sp]; for(let i=si;i<pts.length;i++) pc.push(pts[i]); out.push(pc);
  return out;
}

/* ---------- Neural Networks from Scratch ----------
   Three interchange bars are the input, hidden and output layers; the seven parts
   are lines that re-order between layers, so their crossings draw the weights. */
MAPS['neural-networks-from-scratch'] = { h:330, draw(M){
  const cx=[80,320,560], cy=165, sp=[25,40,25];
  const b=[3,0,5,1,6,2,4], c=[4,2,6,0,5,1,3];
  const y=(j,lane)=>cy+(lane-3)*sp[j];
  cx.forEach((x,j)=>M.rect(x-30,y(j,0)-28,60,y(j,6)-y(j,0)+56,30));
  const mid=[(cx[0]+cx[1])/2,(cx[1]+cx[2])/2];
  for(let k=0;k<7;k++){
    const y0=y(0,k), y1=y(1,b[k]), y2=y(2,c[k]);
    const d1=Math.abs(y1-y0), d2=Math.abs(y2-y1);
    const m1=mid[0]+(k-3)*5, m2=mid[1]-(k-3)*5;
    const pts=[[-60,y0],[m1-d1/2,y0],[m1+d1/2,y1],[m2-d2/2,y1],[m2+d2/2,y2],[700,y2]];
    const avoid=[OUT,OUTR,...cx.map(x=>[x-24,-1e4,x+24,1e4])];
    M.line(k,pts,{where:'h',avoid,side:1,bullet:66,r:18});
  }
  cx.forEach((x,j)=>M.pill(x,y(j,0),x,y(j,6),8.5));
  M.tlabel('input',cx[0],y(0,6)+50); M.tlabel('hidden',cx[1],y(1,6)+50); M.tlabel('output',cx[2],y(2,6)+50);
}};

/* ---------- AI Context Engineering ----------
   Eight sources fan into the context window and run as one bundle to the capstone
   interchange: what the model sees is assembled, compressed, and fed forward. */
MAPS['ai-context-engineering'] = { h:336, draw(M){
  const lane=k=>126+12*k;
  M.zone(`M324,90 H720 V246 H324 a20,20 0 0 1 -20,-20 V110 a20,20 0 0 1 20,-20Z`);
  M.tlabel('context window',604,111,{anchor:'end'});
  for(let k=0;k<8;k++){
    const top=k<4, j=top?k:7-k;
    const yA= top? 14+27*k : 322-27*(7-k);
    const xB= 192-10*j;

/* ---------- Data Structures & Algorithms in Python ----------
   The library's longest line (69 stations) coils through a matrix: spiral traversal. */
MAPS['dsa-in-python'] = { h:372, draw(M){
  const g=48, x0=14, x1=14+12*g, y0=10, y1=10+7*g;
  for(let i=0;i<=12;i++) for(let j=0;j<=7;j++) M.rect(x0+i*g-18,y0+j*g-18,36,36,3,{cls:'cell'});
  const pts=[[-60,y0],[x1,y0]]; let L=x0, T=y0+g, Rr=x1, B=y1, k=0;
  const maxSides=10;
  while(k<maxSides){
    const s=k%4;
    if(s===0){ if(T>B) break; pts.push([Rr,B]); Rr-=g; }
    else if(s===1){ if(L>Rr) break; pts.push([L,B]); B-=g; }
    else if(s===2){ if(T>B) break; pts.push([L,T]); L+=g; }
    else { if(L>Rr) break; pts.push([Rr,T]); T+=g; }
    k++;
  }
  const counts=M.parts().map(p=>p[2]), tot=counts.reduce((a,b)=>a+b,0);
  const cum=polyCum(pts), s0=84, S=cum[cum.length-1]-s0;
  let acc=0; const cuts=counts.slice(0,-1).map(c=>{ acc+=c; return s0+S*acc/tot; });
  const pieces=cutPoly(pts,cuts,26);
  pieces.forEach((pc,i)=>{
    M.line(i,pc,{ends:'end',ring:'end',avoid:i===0?[[-100,-1e4,s0-60,1e4]]:[],side:-1,r:20,bullet:i===0?66:undefined});
  });
  M.tlabel('spiral traversal',(x0+x1)/2,y0+3.5*g-4,{anchor:'middle'}); M.tlabel('of a matrix',(x0+x1)/2,y0+3.5*g+16,{anchor:'middle'});
}};

function buildCover(slug, host){
  const m=META[slug]||{};

    const stops=['Batching','KV-cache','Paged attention','Speculative decoding'];

  }

  else if(night) d.colors=LINES_NIGHT;
  const colors = d.colors || LINES;
  const c=document.createElement('div');
  c.className='cover'+(night?' night':''); c.dataset.slug=slug;
  host.appendChild(c);
  const parts=d.parts||[]; let acc=1;
  let keyHTML;
  if(d.coming_soon){
    keyHTML = d.stops.map((s,i)=>`<div class="k"><b class="hollow" style="--kc:${colors[0]}"></b><span>${s}</span><i>stop ${i+1}</i></div>`).join('');
  } else keyHTML = parts.map((p,i)=>{ const r=`${pad(acc)}${p[2]>1?'–'+pad(acc+p[2]-1):''}`; acc+=p[2];

  let stage=d.stage||''; if(stage && !/^Stage/.test(stage)) stage='Stage 6 · '+stage;

    <svg class="map" viewBox="0 0 720 888" xmlns="http://www.w3.org/2000/svg"></svg>

      <div class="imprint"><div class="stats">${stats}</div><div class="brand">${vmark(night)}Vizuara Books</div></div>
    </div>`;

function placeMap(o){
