<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Some Assembly Required</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap" rel="stylesheet">
<style>
:root{
  --bench:#1B463C; --cream:#F3EEE2; --ink:#14201D;
}
*{box-sizing:border-box}
html,body{margin:0;background:#E9E4D8;color:var(--ink);font-family:Archivo,sans-serif}
.covers{display:flex;flex-wrap:wrap;gap:48px;padding:48px;justify-content:center}
.cover{position:relative;width:720px;height:888px;overflow:hidden;flex:none;background:var(--bench)}
.cover svg{position:absolute;left:0;top:0;display:block}
.cover .t{position:absolute;left:48px;right:40px;color:var(--cream);font-family:Archivo;font-weight:800;font-stretch:87.5%;letter-spacing:-0.012em;line-height:.94;margin:0}
</style>
</head>
<body>
<section class="covers" id="covers"></section>

<script>
/* ============================================================
   SOME ASSEMBLY REQUIRED — cover engine
   Every book is a model kit: the subject's real components are
   molded onto a sprue. Frame, bench, type and imprint never change.
   ============================================================ */
const W = 720, H = 888;

const MATS = {
  bench:   {ground:'#1B463C', minor:'#23524A', major:'#2C5F55', num:'#6F9B8E', shadow:'#0F2B25', text:'#F3EEE2', dim:'#A9C3BA'},
  factory: {ground:'#3B2319', minor:'#482C21', major:'#57372A', num:'#A08170', shadow:'#1F120C', text:'#F6E9CF', dim:'#CBB293'},
};
const PLASTIC = {
  bone:   {base:'#ECE4D1', hi:'#FFFDF7', lo:'#A39A83', ink:'#857C66'},
  red:    {base:'#DE4A2E', hi:'#FF8E72', lo:'#8A2412', ink:'#7A1F10'},
  yellow: {base:'#F1BF2C', hi:'#FFEAA3', lo:'#9C7507', ink:'#7E5E06'},
  grey:   {base:'#B8BDC1', hi:'#F1F3F5', lo:'#6C747A', ink:'#5B6268'},
  lilac:  {base:'#B4A3E4', hi:'#E6DDFF', lo:'#65569A', ink:'#524584'},
  gold:   {base:'url(#gold)', hi:'#FFF1BE', lo:'#6B4B12', ink:'#5E410F'},
  clear:  {base:'rgba(225,245,238,.13)', hi:'rgba(255,255,255,.62)', lo:'rgba(0,0,0,.30)', ink:'rgba(255,255,255,.55)'},
};

/* ---------- tiny SVG helpers (part-local coordinates) ---------- */
const n2 = v => +(+v).toFixed(2);
const R  = (x,y,w,h,r=0) => `<rect x="${n2(x)}" y="${n2(y)}" width="${n2(w)}" height="${n2(h)}" rx="${r}"/>`;
const C  = (cx,cy,r) => `<circle cx="${n2(cx)}" cy="${n2(cy)}" r="${r}"/>`;
const ROD = (d,w) => `<path d="${d}" fill="none" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const P  = (d) => `<path d="${d}" stroke-linejoin="round"/>`;
const T  = (x,y,s,size,o={}) => `<text x="${n2(x)}" y="${n2(y)}" font-size="${size}" text-anchor="${o.a||'middle'}" font-family="${o.f||'Archivo'}" font-weight="${o.w||800}" style="font-stretch:${o.st||'100%'}" stroke="none" ${o.ls?`letter-spacing="${o.ls}"`:''}>${s}</text>`;
const pts = (arr) => arr.map((p,i)=>(i?'L':'M')+n2(p[0])+' '+n2(p[1])).join(' ');
const ringD = (cx,cy,r1,r2) => `M${cx-r1} ${cy}a${r1} ${r1} 0 1 0 ${2*r1} 0a${r1} ${r1} 0 1 0 ${-2*r1} 0Z M${cx-r2} ${cy}a${r2} ${r2} 0 1 1 ${2*r2} 0a${r2} ${r2} 0 1 1 ${-2*r2} 0Z`;
const RING = (cx,cy,r1,r2) => `<path fill-rule="evenodd" stroke="none" d="${ringD(cx,cy,r1,r2)}"/>`;
const arrowHead = (x,y,ang,s=14) => { // tip at x,y pointing along ang (deg)
  const a = ang*Math.PI/180, b = 2.5;
  const p1=[x - s*Math.cos(a) + s*.62*Math.sin(a), y - s*Math.sin(a) - s*.62*Math.cos(a)];
  const p2=[x - s*Math.cos(a) - s*.62*Math.sin(a), y - s*Math.sin(a) + s*.62*Math.cos(a)];
  return `<path d="${pts([[x,y],p1,p2])}Z" stroke-linejoin="round" stroke-width="${b}"/>`;
};
/* decoration: drawn after the plastic, in the plastic's own light/dark */
const ENG = (d,w=1.6) => `<path d="${d}" fill="none" stroke="%HI%" stroke-width="${w}" stroke-linecap="round" transform="translate(.9 .9)"/><path d="${d}" fill="none" stroke="%LO%" stroke-width="${w}" stroke-linecap="round"/>`;
const RELIEF = (el) => `<g fill="%HI%" stroke="%HI%" transform="translate(-.9 -.9)">${el}</g><g fill="%LO%" stroke="%LO%" transform="translate(1.1 1.3)">${el}</g><g fill="%BASE%" stroke="%BASE%">${el}</g>`;

/* ================= PARTS LIBRARY =================
   each part: {w,h,g (plastic geometry), d (decoration), gates:[[x,y,'up'|'down']], name} */
const PARTS = {
  /* ---------- neural networks ---------- */
  network(layers=[3,4,2], opt={}) {
    const r = opt.r||15, dx = opt.dx||102, pitch = opt.pitch||48, rodW = opt.rod||5;
    const maxN = Math.max(...layers), h = (maxN-1)*pitch + 2*r, w = (layers.length-1)*dx + 2*r;
    const nodes = layers.map((k,li)=>Array.from({length:k},(_,i)=>[r+li*dx, h/2 + (i-(k-1)/2)*pitch]));
    let g = '', d = '';
    for (let li=0; li<layers.length-1; li++) for (const a of nodes[li]) for (const b of nodes[li+1]) g += ROD(`M${a[0]} ${a[1]}L${b[0]} ${b[1]}`, rodW);
    nodes.flat().forEach(([x,y])=>{ g += C(x,y,r); d += ENG(ringD(x,y,r*.5,r*.5).split('Z')[0]+'Z',1.4); });
    const mid = nodes[Math.floor(layers.length/2)];
    return {w,h,g,d,gates:[[mid[0][0], mid[0][1]-r,'up'],[mid[mid.length-1][0], mid[mid.length-1][1]+r,'down']], name:'Network'};
  },
  neuron() {
    const cx=100, cy=48, r=34; let g='', d='';
    [[8,10],[2,48],[8,86]].forEach(([x,y])=> g += ROD(`M${x} ${y}Q${cx-40} ${cy+(y-cy)*.35} ${cx-r+4} ${cy}`,6));
    g += C(cx,cy,r) + ROD(`M${cx+r-2} ${cy}L${cx+r+44} ${cy}`,7) + arrowHead(cx+r+60,cy,0,18);
    d += ENG(`M${cx+10} ${cy-13}L${cx-10} ${cy-13}L${cx+3} ${cy}L${cx-10} ${cy+13}L${cx+10} ${cy+13}`,2.2);
    return {w:cx+r+62,h:96,g,d,gates:[[cx,cy-r,'up'],[cx,cy+r,'down']],name:'Neuron'};
  },
  sigmoid() {
    const w=170,h=86, p=[]; for(let x=0;x<=w;x+=5){p.push([x, 8 + 70 - 70/(1+Math.exp(-(x-w/2)/15))]);}
    let g = ROD(pts(p),9) + C(0,p[0][1],8) + C(w,p[p.length-1][1],8);
    return {w,h,g,d:'',gates:[[w/2,h/2,'up'],[w/2,h/2,'down']],name:'Sigmoid'};
  },
  bowl() {
    const w=150,h=86, p=[]; for(let x=0;x<=w;x+=5){p.push([x, h-4 - (h-12)*(1-((x-w/2)/(w/2))**2)]);}
    // U-shape: ends high
    const q = p.map(([x,y])=>[x, (h-4) - (y-4)]);
    return {w,h,g:ROD(pts(q),9),d:'',gates:[[w/2,h-4,'down'],[0,8,'up']],name:'Loss'};
  },
  ball(r=15) {
    return {w:2*r,h:2*r,g:C(r,r,r),d:`<circle cx="${r-r*.35}" cy="${r-r*.35}" r="${r*.28}" fill="%HI%" opacity=".8"/>`,gates:[[r,0,'up'],[r,2*r,'down']],name:'Ball'};
  },
  tile(ch, w=46, h=46, size=30, o={}) {
    return {w,h,g:R(0,0,w,h,7),d:RELIEF(T(w/2,h/2+size*.36,ch,size,o)),gates:[[w/2,0,'up'],[w/2,h,'down']],name:'Tile '+ch};
  },
  backprop() {
    const w=170,h=70; const g = ROD(`M${w-6} ${h-10}Q${w/2} ${-22} 22 ${h-14}`,8) + arrowHead(8,h-4,118,20);
    return {w,h,g,d:'',gates:[[w/2,6,'up'],[w-6,h-10,'down']],name:'Backprop'};
  },
  /* ---------- transformers / LLMs ---------- */
  causalMask(n=6, cell=26, gap=6) {
    const pitch = cell+gap; let g='', d='';
    for (let i=0;i<n;i++) for (let j=0;j<=i;j++) {
      const x=j*pitch, y=i*pitch; g += R(x,y,cell,cell,3);
      if (j<i) g += R(x+cell-1,y+cell/2-3,gap+2,6); // bridge right
      if (i<n-1) g += R(x+cell/2-3,y+cell-1,6,gap+2); // bridge down
      if (i===j) d += `<circle cx="${x+cell/2}" cy="${y+cell/2}" r="4.5" fill="%LO%"/>`;
    }
    const s = n*pitch-gap;
    return {w:s,h:s,g,d,gates:[[cell/2,0,'up'],[s/2,s,'down']],name:'Causal mask'};
  },
  block() {
    const w=96,h=176; let g=R(0,0,w,h,12), d='';
    d += ENG(`M14 22h68v46h-68zM14 104h68v46h-68z`,1.6) + ENG(`M48 76v20M40 86h16`,2);
    d += RELIEF(T(48,50,'ATTN',13,{st:'87.5%'})) + RELIEF(T(48,132,'FFN',13,{st:'87.5%'}));
    return {w,h,g,d,gates:[[w/2,0,'up'],[w/2,h,'down']],name:'Block'};
  },
  tokens(words=['to','ken','s']) {
    let x=0, g='', d=''; const h=44;
    words.forEach((t,i)=>{ const w = 22 + t.length*15; g += R(x,0,w,h,6); d += RELIEF(T(x+w/2,h/2+8,t,22,{w:700})); if(i<words.length-1) g += R(x+w-1,h/2-3,10,6); x += w+8; });
    return {w:x-8,h,g,d,gates:[[22,0,'up'],[x-30,h,'down']],name:'Tokens'};
  },
  qkv() {
    const w=132,h=128; let g='', d='';
    const tips=[[22,24],[66,24],[110,24]];
    tips.forEach(([x,y])=> g += ROD(`M${x} ${y}Q${x} ${y+44} ${w/2} ${h-26}`,7));
    g += ROD(`M${w/2} ${h-28}L${w/2} ${h-6}`,9);
    tips.forEach(([x,y],i)=>{ g += C(x,y,21); d += RELIEF(T(x,y+8,'QKV'[i],22)); });
    return {w,h,g,d,gates:[[66,3,'up'],[w/2,h-2,'down']],name:'Q·K·V head'};
  },
  wave(len=170, amp=20, periods=2) {
    const p=[]; for(let x=0;x<=len;x+=3) p.push([x, amp+4 + amp*Math.sin(x/len*periods*2*Math.PI)]);
    return {w:len,h:2*amp+8,g:ROD(pts(p),8),d:'',gates:[[len/4,4,'up'],[len*3/4,2*amp+4,'down']],name:'Position wave'};
  },
  /* ---------- systems ---------- */
  cluster(nx=4, ny=4, chip=36, pitch=52) {
    let g='', d='';
    for (let i=0;i<ny;i++) for (let j=0;j<nx;j++) {
      const x=j*pitch, y=i*pitch;
      if (j<nx-1) g += R(x+chip-1,y+chip/2-3.5,pitch-chip+2,7);
      if (i<ny-1) g += R(x+chip/2-3.5,y+chip-1,7,pitch-chip+2);
      g += R(x,y,chip,chip,4);
      d += ENG(`M${x+10} ${y+10}h${chip-20}v${chip-20}h${-(chip-20)}z`,1.5);
    }
    const s=(nx-1)*pitch+chip, t=(ny-1)*pitch+chip;
    return {w:s,h:t,g,d,gates:[[chip/2+pitch,0,'up'],[chip/2+2*pitch,t,'down']],name:'GPU grid'};
  },
  dimArrow(label) {
    const w=50,h=118; let g = R(0,h-30,w,30,6) + ROD(`M${w/2} ${h-30}L${w/2} ${22}`,8) + arrowHead(w/2,2,-90,22);
    return {w,h,g,d:RELIEF(T(w/2,h-9,label,17,{st:'87.5%'})),gates:[[w/2,2,'up'],[w/2,h,'down']],name:label};
  },
  ring(k=8, r=58, nr=11) {
    let g = RING(r+nr,r+nr,r+3.5,r-3.5), d='';
    for (let i=0;i<k;i++){ const a=i/k*2*Math.PI - Math.PI/2; g += C(r+nr+r*Math.cos(a), r+nr+r*Math.sin(a), nr); }
    // direction chevrons
    for (let i=0;i<k;i++){ const a=(i+.5)/k*2*Math.PI - Math.PI/2; const x=r+nr+(r-14)*Math.cos(a), y=r+nr+(r-14)*Math.sin(a); d += `<path d="M${n2(x)} ${n2(y)}l${n2(5*Math.cos(a+2.4))} ${n2(5*Math.sin(a+2.4))}M${n2(x)} ${n2(y)}l${n2(5*Math.cos(a-2.4+Math.PI))} ${n2(5*Math.sin(a-2.4+Math.PI))}" stroke="%LO%" stroke-width="1.6" fill="none"/>`; }
    const s=2*(r+nr);
    return {w:s,h:s,g,d,gates:[[s/2,0,'up'],[s/2,s,'down']],name:'All-reduce ring'};
  },
  pipeline(k=4) {
    let g='', x=0; const b=40;
    for (let i=0;i<k;i++){ g += R(x,0,b,b,6); if(i<k-1){ g += ROD(`M${x+b} ${b/2}L${x+b+16} ${b/2}`,6) + arrowHead(x+b+26,b/2,0,12);} x += b+30; }
    return {w:x-30,h:b,g,d:'',gates:[[b/2,0,'up'],[x-30-b/2,b,'down']],name:'Pipeline'};
  },
};

/* ============== SPRUE LAYOUT ENGINE ============== */
function sprue(fr, rows, pl, mat, opts={}) {
  const TF = 11, TR = 9;              // frame and runner thickness
  let geo = '', deco = '', tags = '';
  const {x,y,w,h} = fr;
  geo += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="none" stroke-width="${TF}"/>`;
  const tw = rows.reduce((a,r)=>a+(r.h||1),0);
  let top = y, num = 1; const runnersY=[y];
  rows.forEach((row,ri)=>{
    const bh = h*(row.h||1)/tw, bot = top+bh;
    if (ri<rows.length-1) { geo += `<path d="M${x} ${n2(bot)}H${x+w}" fill="none" stroke-width="${TR}"/>`; runnersY.push(bot); }
    const parts = row.parts.map(p=>p.w?{p}:p);
    const padY = 34, padX = 30;
    const maxH = Math.max(...parts.map(q=>q.p.h*(q.s||1)));
    let sc = Math.min(1, (bh-2*padY)/maxH);
    const sumW = parts.reduce((a,q)=>a+q.p.w*(q.s||1),0);
    sc = Math.min(sc, (w-2*padX-(parts.length-1)*26)/sumW);
    const gap = (w - sumW*sc)/(parts.length+1);
    let cx = x + gap;
    parts.forEach(q=>{
      const s = sc*(q.s||1), pw=q.p.w*s, ph=q.p.h*s;
      const px = cx + (q.dx||0), py = top + (bh-ph)/2 + (q.dy||0);
      geo += `<g transform="translate(${n2(px)} ${n2(py)}) scale(${n2(s)})">${q.p.g}</g>`;
      deco += `<g transform="translate(${n2(px)} ${n2(py)}) scale(${n2(s)})">${q.p.d}</g>`;
      q.p.gates.forEach(([gx,gy,dir],gi)=>{
        const X = px+gx*s, Y = py+gy*s, Yr = dir==='up'?top:bot;
        const y0=Math.min(Y,Yr), y1=Math.max(Y,Yr);
        geo += `<path stroke="none" d="M${n2(X-3.5)} ${n2(Yr)}L${n2(X+3.5)} ${n2(Yr)}L${n2(X+2)} ${n2(Y)}L${n2(X-2)} ${n2(Y)}Z"/>`;
        if (gi===0) { // part number tag on the runner
          const tx = X + 9, ty = dir==='up' ? top+TR/2-1 : bot-TR/2-12;
          geo += R(tx,ty,17,13,2);
          tags += `<text x="${n2(tx+8.5)}" y="${n2(ty+10)}" font-size="9.5" font-family="Martian Mono" font-weight="700" text-anchor="middle" fill="%INK%">${num}</text>`;
        }
      });
      num++;
      cx += pw + gap;
    });
    top = bot;
  });
  // ejector pin marks on runners
  let pins='';
  runnersY.concat([y+h]).forEach(ry=>[0.25,0.75].forEach(f=>{ const px=x+w*f; pins += `<circle cx="${n2(px)}" cy="${n2(ry)}" r="4.2" fill="none" stroke="%LO%" stroke-width="1.2"/><circle cx="${n2(px+.7)}" cy="${n2(ry+.7)}" r="4.2" fill="none" stroke="%HI%" stroke-width=".8" opacity=".7"/>`; }));
  // sprue identification tab (molded maker's name + sprue letter)
  const tabW=112, tabX = x+w-tabW-24, tabY = y+TF/2-1;
  geo += R(tabX, tabY, tabW, 22, 3);
  tags += `<text x="${tabX+10}" y="${tabY+15.5}" font-size="10" font-family="Martian Mono" font-weight="700" letter-spacing=".08em" fill="%INK%">VIZUARA</text><text x="${tabX+tabW-10}" y="${tabY+16}" font-size="14" font-family="Archivo" font-weight="800" text-anchor="end" fill="%INK%">${opts.letter||'A'}</text>`;

  const id = 'g'+Math.random().toString(36).slice(2,8);
  const sub = s => s.replace(/%HI%/g,pl.hi).replace(/%LO%/g,pl.lo).replace(/%BASE%/g,pl.base).replace(/%INK%/g,pl.ink);
  return `<defs><g id="${id}">${geo}</g></defs>
    <use href="#${id}" x="7" y="9" fill="${mat.shadow}" stroke="${mat.shadow}" opacity=".55"/>
    <use href="#${id}" x="1.5" y="2" fill="${pl.lo}" stroke="${pl.lo}"/>
    <use href="#${id}" x="-1" y="-1" fill="${pl.hi}" stroke="${pl.hi}"/>
    <use href="#${id}" fill="${pl.base}" stroke="${pl.base}"/>
    ${sub(deco)}${sub(pins)}${sub(tags)}`;
}

/* ============== THE BENCH (cutting mat) ============== */
function bench(mat) {
  let s = `<rect width="${W}" height="${H}" fill="${mat.ground}"/>`;
  let minor='', major='';
  for (let x=48; x<W; x+=48) (x%96? (minor += `M${x} 0V${H}`) : (major += `M${x} 0V${H}`));
  for (let y=48; y<H; y+=48) (y%96? (minor += `M0 ${y}H${W}`) : (major += `M0 ${y}H${W}`));
  s += `<path d="${minor}" stroke="${mat.minor}" stroke-width="1"/><path d="${major}" stroke="${mat.major}" stroke-width="1.4"/>`;
  // rulers: left edge (inches down) and bottom edge (inches across) — true to trim size
  let ticks='', nums='';
  for (let y=0; y<=H; y+=12) { const k=(y%96===0)?14:(y%48===0)?9:5; ticks += `M0 ${y}h${k}`; }
  for (let x=0; x<=W; x+=12) { const k=(x%96===0)?14:(x%48===0)?9:5; ticks += `M${x} ${H}v${-k}`; }
  for (let i=1;i<=9;i++) nums += `<text x="17" y="${i*96+3.5}" font-size="9" font-family="Martian Mono" fill="${mat.num}">${i}</text>`;
  for (let i=1;i<=7;i++) nums += `<text x="${i*96}" y="${H-18}" font-size="9" font-family="Martian Mono" text-anchor="middle" fill="${mat.num}">${i}</text>`;
  s += `<path d="${ticks}" stroke="${mat.num}" stroke-width="1.2"/>${nums}`;
  return s;
}

/* ============== IMPRINT MARK: a V on its own little sprue ============== */
function mark(x,y,s,col,bg) {
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="${col}">
    <rect x="1.5" y="1.5" width="29" height="29" rx="5" stroke-width="3"/>
    <path d="M9 10.5L16 24L23 10.5" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M9 3v6.5M23 3v6.5" stroke-width="1.6"/>
  </g>`;
}

const LEVELS = {beginner:1, intermediate:2, advanced:3};

function renderCover(b) {
  const mat = MATS[b.mat||'bench'], pl = PLASTIC[b.plastic];
  const el = document.createElement('div');
  el.className = 'cover'; el.dataset.slug = b.slug;
  const lh = b.size*0.94, titleTop = 96;
  const titleBot = titleTop + b.lines.length*lh;
  const subY = titleBot + 26;
  const frTop = subY + 44, frBot = 792;
  const lv = LEVELS[b.level];
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4D77E"/><stop offset=".45" stop-color="#C9983A"/><stop offset=".7" stop-color="#E8C766"/><stop offset="1" stop-color="#A67A27"/></linearGradient></defs>
    ${bench(mat)}
    ${mark(48,38,0.84,mat.text)}
    <text x="84" y="57" font-family="Archivo" font-weight="700" style="font-stretch:112.5%" font-size="13" letter-spacing=".2em" fill="${mat.text}">VIZUARA BOOKS</text>
    <text x="${W-48}" y="57" font-family="Martian Mono" font-weight="600" font-size="12" letter-spacing=".06em" text-anchor="end" fill="${mat.dim}">KIT Nº ${String(b.kit).padStart(2,'0')}</text>
    <text x="48" y="${subY}" font-family="Martian Mono" font-weight="500" font-size="13" letter-spacing=".02em" fill="${mat.dim}">${b.sub}</text>
    ${sprue({x:48,y:frTop,w:624,h:frBot-frTop}, b.rows(PARTS), pl, mat)}
    <g font-family="Martian Mono" font-size="12" font-weight="600" letter-spacing=".06em" fill="${mat.text}">
      <text x="48" y="846">SKILL LEVEL</text>
      ${[0,1,2].map(i=>`<rect x="${150+i*22}" y="833" width="16" height="16" rx="2" ${i<lv?`fill="${mat.text}"`:`fill="none" stroke="${mat.text}" stroke-width="1.5"`}/>`).join('')}
      <text x="226" y="846" fill="${mat.dim}">${b.level.toUpperCase()}</text>
      <text x="${W-48}" y="846" text-anchor="end">${b.capsules} CAPSULES · ${b.hours} H</text>
    </g>
  </svg>`;
  el.innerHTML = svg + `<h2 class="t" style="top:${titleTop - b.size*0.2}px;font-size:${b.size}px">${b.lines.join('<br>')}</h2>`;
  return el;
}
