<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{margin:0;background:#ddd}
.cover{width:720px;height:888px;position:relative;overflow:hidden;background:#0D6A3F;margin:20px}
</style></head><body>
<div class="cover" data-slug="spec1"><svg id="s1" width="720" height="888" viewBox="0 0 720 888"></svg></div>
<div class="cover" data-slug="spec2"><svg id="s2" width="720" height="888" viewBox="0 0 720 888"></svg></div>
<script src="board.js"></script>
<script>
const st = {fillTop:'#FFF3D6', fillBot:'#F4B41A', outline:'#17120E', shadow:'#8E1A12', inline:'#D0261C'};
function block(svgId, lines){
  let y=30, out='';
  for (const [txt,H] of lines){
    const ft = Board.fit(txt, H, 640);
    const p = Board.paint(txt, ft.u, ft.H, st);
    out += `<g transform="translate(${(720-p.w)/2} ${y})">${p.svg}</g>`;
    y += ft.H + p.depth + 18;
  }
  document.getElementById(svgId).innerHTML = out;
}
block('s1', [['ABCDEFGHI',110],['JKLMNOPQR',110],['STUVWXYZ',110],['0123456789',110],['AI CONTEXT',100],['ENGINEERING',100]]);
document.querySelector('[data-slug=spec2]').style.background='#D0261C';
block('s2', [['NEURAL',130],['NETWORKS',120],['5D-PARALLELISM',80],['MATHEMATICAL',90],['PI HERMES CODEX',70],['KIMI K3 SQL RAG',70],['WAX SKY JAZZ',70]]);
</script>
</body></html>
