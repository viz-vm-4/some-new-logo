<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Jantar — Vizuara Books cover system</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDE5D8;--ink:#26140E;--red:#5B1D18}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Anek Latin',sans-serif}
.covers{display:flex;flex-wrap:wrap;gap:56px 48px;padding:48px}
.cover{position:relative;width:720px;height:888px;overflow:hidden;flex:none;background:var(--sky);color:var(--ink)}
.cover svg.art{position:absolute;left:0;top:0}
.cover .title{position:absolute;left:40px;top:40px;right:40px;margin:0;font-weight:600;font-stretch:80%;font-size:68px;line-height:.97;letter-spacing:-.004em;color:var(--ink)}
.cover .band{position:absolute;left:40px;right:40px;bottom:30px;color:#F4EADC}
.cover .row{display:flex;justify-content:space-between;align-items:center}
.cover .r1{font-size:17px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.cover .r1 b{font-weight:700}
.cover .imp,.cover .lvl{display:flex;align-items:center;gap:10px}
.cover .r2{margin-top:10px;font-family:'Tiro Devanagari Hindi',serif;font-style:italic;font-size:16px;color:#E3C3AE}
</style></head>
<body>
<main class="covers" id="covers"></main>
<script>/*ENGINE*/</script>
<script>/*COVERS*/</script>
<script>const host=document.getElementById('covers');for(const b of JANTAR.BOOKS)host.appendChild(JANTAR.build(b));</script>
</body></html>
