<body>
<main class="covers" id="covers"></main>
<script>/* Jantar — a tiny sun-and-stone renderer.
   Convex solids -> back-face cull -> BSP painter order -> analytic hard shadows
   (every sun-facing face of every caster is projected along the sun ray onto each lit
   receiver plane and clipped to it). Output: flat-toned SVG polygons, pure vector. */
(function (G) {
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const nrm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const D = Math.PI / 180;

  function newell(P) {
    let x = 0, y = 0, z = 0;
    for (let i = 0; i < P.length; i++) {
      const a = P[i], b = P[(i + 1) % P.length];
      x += (a[1] - b[1]) * (a[2] + b[2]); y += (a[2] - b[2]) * (a[0] + b[0]); z += (a[0] - b[0]) * (a[1] + b[1]);
    }
    return nrm([x, y, z]);
  }
  function centroid(P) { let c = [0, 0, 0]; for (const p of P) c = add(c, p); return mul(c, 1 / P.length); }

  // ---------- colour ----------
  function hex(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
  function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + [0, 1, 2].map(i => Math.round(A[i] + (B[i] - A[i]) * t).toString(16).padStart(2, '0')).join(''); }

  // ---------- scene ----------
  class Scene {
    constructor() { this.faces = []; this.nsolid = 0; this.overlays = []; }
    // faces: array of point arrays; normals oriented outward from the solid's centroid
    solid(faces, o = {}) {
      const id = this.nsolid++;
      const c = o.center || centroid(faces.flat());
      for (let pts of faces) {
        pts = pts.map(p => p.slice());
        let n = newell(pts);
        if (dot(n, sub(centroid(pts), c)) < 0) { pts.reverse(); n = mul(n, -1); }
        const mat = typeof o.mat === 'function' ? o.mat(n, pts) : o.mat;
        if (mat === null) continue;
        this.faces.push({ pts, n, mat, cast: o.cast !== false, recv: o.recv !== false, sid: id, hide: o.hide });
      }
      return id;
    }
    // a single face with an explicit "outward" hint direction
    face(pts, hint, o = {}) {
      pts = pts.map(p => p.slice());
      let n = newell(pts); if (dot(n, hint) < 0) { pts.reverse(); n = mul(n, -1); }
      this.faces.push({ pts, n, mat: o.mat, cast: o.cast !== false, recv: o.recv !== false, sid: this.nsolid++, decal: o.decal });
    }
    box(x0, y0, z0, x1, y1, z1, o = {}) {
      const P = (x, y, z) => [x, y, z];
      const f = [
        [P(x0, y0, z0), P(x1, y0, z0), P(x1, y1, z0), P(x0, y1, z0)],
        [P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)],
        [P(x0, y0, z0), P(x1, y0, z0), P(x1, y0, z1), P(x0, y0, z1)],
        [P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)],
        [P(x0, y0, z0), P(x0, y1, z0), P(x0, y1, z1), P(x0, y0, z1)],
        [P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1)],
      ];
      return this.solid(f, o);
    }
    // extrude planar convex polygon `base` (3D points) by vector `dir`
    extrude(base, dir, o = {}) {
      const top = base.map(p => add(p, dir));
      const f = [base, top];
      for (let i = 0; i < base.length; i++) { const j = (i + 1) % base.length; f.push([base[i], base[j], top[j], top[i]]); }
      return this.solid(f, o);
    }
    // planar convex top polygon, walls dropped vertically to z = z0
    slab(top, z0, o = {}) {
      const bot = top.map(p => [p[0], p[1], z0]);
      const f = [top, bot.slice().reverse()];
      for (let i = 0; i < top.length; i++) { const j = (i + 1) % top.length; f.push([top[i], top[j], bot[j], bot[i]]); }
      return this.solid(f, o);
    }
    // thin decal lying on a surface (quad pts), pushed off along normal n
    decal(pts, n, mat, off = 0.35) {
      this.face(pts.map(p => add(p, mul(n, off))), n, { mat, cast: false, decal: true });
    }
  }

  // ---------- clipping ----------
  function clipPlane(P, n, d, eps = 0) { // keep dot(n,p) - d >= eps
    const out = []; const m = P.length; if (!m) return out;
    for (let i = 0; i < m; i++) {
      const a = P[i], b = P[(i + 1) % m];
      const da = dot(n, a) - d - eps, db = dot(n, b) - d - eps;
      if (da >= 0) out.push(a);
      if ((da >= 0) !== (db >= 0)) { const t = da / (da - db); out.push(lerp3(a, b, t)); }
    }
    return out;
  }
  function area2(P) { let s = 0; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }
  function clip2(subj, clip) { // convex clip polygon
    let out = subj; const ccw = area2(clip) > 0 ? 1 : -1;
    for (let i = 0; i < clip.length && out.length; i++) {
      const a = clip[i], b = clip[(i + 1) % clip.length]; const inp = out; out = [];
      const side = (p) => ccw * ((b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]));
      for (let k = 0; k < inp.length; k++) {
        const p = inp[k], q = inp[(k + 1) % inp.length];
        const sp = side(p), sq = side(q);
        if (sp >= 0) out.push(p);
        if ((sp >= 0) !== (sq >= 0)) { const t = sp / (sp - sq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); }
      }
    }
    return out;
  }

  // ---------- BSP ----------
  const EPS = 1e-3;
  function split(poly, n, d, on, front, back) {
    let type = 0; const ts = [];
    for (const p of poly.pts) { const t = dot(n, p) - d; const k = t < -EPS ? 2 : t > EPS ? 1 : 0; type |= k; ts.push(k); }
    if (type === 0) on.push(poly);
    else if (type === 1) front.push(poly);
    else if (type === 2) back.push(poly);
    else {
      const f = [], b = []; const P = poly.pts;
      for (let i = 0; i < P.length; i++) {
        const j = (i + 1) % P.length; const ti = ts[i], tj = ts[j]; const vi = P[i], vj = P[j];
        if (ti !== 2) f.push(vi); if (ti !== 1) b.push(ti !== 2 ? vi.slice() : vi);
        if ((ti | tj) === 3) { const t = (d - dot(n, vi)) / dot(n, sub(vj, vi)); const v = lerp3(vi, vj, t); f.push(v); b.push(v.slice()); }
      }
      if (f.length >= 3) front.push(Object.assign({}, poly, { pts: f }));
      if (b.length >= 3) back.push(Object.assign({}, poly, { pts: b }));
    }
  }
  function bsp(polys) {
    // iterative build
    const root = { polys }; const stack = [root];
    while (stack.length) {
      const node = stack.pop(); const ps = node.polys; delete node.polys;
      if (!ps.length) { node.empty = true; continue; }
      // choose splitter: largest decal-free polygon among a few candidates
      let bi = 0, ba = -1;
      for (let i = 0; i < ps.length && i < 24; i++) { if (ps[i].decal) continue; const a = ps[i].area || 0; if (a > ba) { ba = a; bi = i; } }
      const sp = ps[bi]; node.n = sp.n; node.d = dot(sp.n, sp.pts[0]); node.on = []; const f = [], b = [];
      for (let i = 0; i < ps.length; i++) split(ps[i], node.n, node.d, node.on, f, b);
      node.on.sort((a, b) => (a.decal ? 1 : 0) - (b.decal ? 1 : 0));
      node.front = { polys: f }; node.back = { polys: b }; stack.push(node.front, node.back);
    }
    return root;
  }
  function traverse(node, v, out) {
    // explicit stack traversal back-to-front
    const st = [[node, 0]];
    while (st.length) {
      const [nd, phase] = st.pop();
      if (!nd || nd.empty) continue;
      const camFront = dot(nd.n, v) < 0; // camera in front half-space
      const far = camFront ? nd.back : nd.front, near = camFront ? nd.front : nd.back;
      if (phase === 0) { st.push([nd, 1]); st.push([far, 0]); }
      else { for (const p of nd.on) out.push(p); st.push([near, 0]); }
    }
    return out;
  }

  // ---------- camera / sun ----------
  function camera(az, el, s, ox, oy) {
    const c = [Math.sin(az * D) * Math.cos(el * D), -Math.cos(az * D) * Math.cos(el * D), Math.sin(el * D)];
    const v = mul(c, -1);
    const r = nrm(cross(v, [0, 0, 1])); const u = cross(r, v);
    return { v, r, u, s, ox, oy, P: (p) => [ox + s * dot(p, r), oy - s * dot(p, u)] };
  }
  // elevation-oblique: front (x,z) plane true shape, depth y recedes at angle alpha, factor k
  function oblique(k, alpha, s, ox, oy) {
    const ca = Math.cos(alpha * D), sa = Math.sin(alpha * D);
    const v = nrm([-k * ca, 1, -k * sa]);
    return { v, s, ox, oy, k, alpha, P: (p) => [ox + s * (p[0] + k * ca * p[1]), oy - s * (p[2] + k * sa * p[1])] };
  }
  function sunDir(azCompass, alt) { return [Math.sin(azCompass * D) * Math.cos(alt * D), Math.cos(azCompass * D) * Math.cos(alt * D), Math.sin(alt * D)]; }

  // material tone for a face normal
  function tone(m, n, L, lit) {
    if (m.flat) return m.flat;
    const k = dot(n, L);
    if (lit && k > 0) return mix(m.lo, m.hi, Math.min(1, Math.pow(k, m.g || 0.8)));
    return mix(m.sh, m.shUp || m.sh, Math.max(0, n[2]));
  }

  const f1 = (x) => (Math.round(x * 100) / 100).toString();
  function pathD(P) { return 'M' + P.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L') + 'Z'; }

  function render(scene, cam, L, opts = {}) {
    const vis = [];
    for (const f of scene.faces) {
      if (f.hide) continue;
      if (dot(f.n, cam.v) < -1e-7) { const P2 = f.pts.map(cam.P); f.area = Math.abs(area2(P2)); vis.push(Object.assign({}, f)); }
    }
    vis.sort((a, b) => b.area - a.area);
    const order = traverse(bsp(vis), cam.v, []);
    const casters = scene.faces.filter(f => f.cast && !f.decal && dot(f.n, L) > 1e-6);
    const out = []; const sw = opts.seam == null ? 0.55 : opts.seam;
    for (const f of order) {
      const k = dot(f.n, L);
      const lit = k > 1e-6 && !f.mat.flat;
      const P2 = f.pts.map(cam.P);
      if (Math.abs(area2(P2)) < 0.02) continue;
      const col = tone(f.mat, f.n, L, lit);
      out.push(`<path d="${pathD(P2)}" fill="${col}" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round"/>`);
      if (!lit || f.recv === false) continue;
      const d0 = dot(f.n, f.pts[0]); const shCol = tone(f.mat, f.n, L, false);
      const shs = [];
      for (const c of casters) {
        if (c.sid === f.sid) continue;
        let any = false; for (const p of c.pts) if (dot(f.n, p) - d0 > 0.05) { any = true; break; }
        if (!any) continue;
        const cp = clipPlane(c.pts, f.n, d0, 0.01); if (cp.length < 3) continue;
        const pr = cp.map(p => { const t = (dot(f.n, p) - d0) / k; return cam.P(sub(p, mul(L, t))); });
        const cl = clip2(pr, P2); if (cl.length < 3 || Math.abs(area2(cl)) < 0.05) continue;
        shs.push(area2(cl) < 0 ? cl.reverse() : cl);
      }
      if (shs.length) out.push(`<path d="${shs.map(pathD).join('')}" fill="${shCol}" stroke="${shCol}" stroke-width="${sw}" stroke-linejoin="round"/>`);
    }
    return out.join('');
  }

  G.J = { add, sub, mul, dot, cross, nrm, len, lerp3, D, Scene, camera, oblique, sunDir, render, mix, clip2, clipPlane, area2, pathD };
})(window);
</script>
<script>/* Jantar covers: palettes, scenes, assembly */
(function () {
  const { Scene, oblique, render, nrm, mix, D } = J;
  const W = 720, H = 888, PL = 748; // plinth (section) line

  // ---------- the three hours ----------
  const STONE = { hi: '#F7CDB0', lo: '#E08865', sh: '#8C3325', shUp: '#9B3E2E', g: 0.85 };
  const HOURS = {
    beginner: {
      label: 'Beginner', hour: 'Morning', n: 1,
      L: nrm([0.78, -0.25, 0.52]),
      sky: '#EFE6D7', ink: '#26140E', sub: '#7A3A28',
      stone: STONE,
      ground: { hi: '#EFE6D7', lo: '#EFE6D7', sh: '#C7AE9A', shUp: '#C7AE9A' },
      marble: { hi: '#FFFAF2', lo: '#F4ECE1', sh: '#C49C8C', shUp: '#CCA697' },
      cut: { flat: '#5B1D18' },
    },
    intermediate: {
      label: 'Intermediate', hour: 'Noon', n: 2,
      L: nrm([0.5, -0.32, 0.86]),
      sky: '#D9A546', ink: '#26140E', sub: '#5B2616',
      stone: STONE,
      ground: { hi: '#D9A546', lo: '#D9A546', sh: '#A9732B', shUp: '#A9732B' },
      marble: { hi: '#FFFBF5', lo: '#F2E8DB', sh: '#BF9A86', shUp: '#C8A492' },
      cut: { flat: '#5B1D18' },
    },
    advanced: {
      label: 'Advanced', hour: 'Evening', n: 3,
      L: nrm([-0.72, 0.52, 0.30]),
      sky: '#1F2143', ink: '#F6EDE0', sub: '#E3A57E',
      stone: { hi: '#F7B583', lo: '#DE7A50', sh: '#5A2731', shUp: '#65303A', g: 0.8 },
      ground: { hi: '#1F2143', lo: '#1F2143', sh: '#121329', shUp: '#121329' },
      marble: { hi: '#FFE4CC', lo: '#F4C5A3', sh: '#7B4A55', shUp: '#86525C' },
      cut: { flat: '#5B1D18' },
    },
  };

  // ---------- helpers ----------
  const CAM = (s = 1, ox = 360, mirror = false) => oblique(0.6, mirror ? 150 : 30, s, ox, PL);
  function ground(S, hr, yB = 3000) {
    S.box(-4000, 0, -1200, 4000, yB, 0, { mat: (n) => (n[1] < -0.5 ? hr.cut : hr.ground), cast: false });
  }
  const tanD = (a) => Math.tan(a * D);

  // ---------- scenes ----------
  const SCENES = {};

  // Samrat Yantra — the right triangle as instrument (gnomon runs away from the viewer)
  SCENES.samrat = (hr) => {
    const S = new Scene(); ground(S, hr);
    const phi = 27, tp = tanD(phi), cp = Math.cos(phi * D), sp = Math.sin(phi * D);
    const y0 = 40, Lg = 760, Hg = Lg * tp, w = 56, par = 10;
    const tri = (x) => [[x, y0, 0], [x, y0 + Lg, 0], [x, y0 + Lg, Hg]];
    S.extrude(tri(-w / 2), [par, 0, 0], { mat: hr.stone });
    S.extrude(tri(w / 2 - par), [par, 0, 0], { mat: hr.stone });
    const run = 16;
    for (let y = y0; y < y0 + Lg - 0.1; y += run) {
      const ye = Math.min(y0 + Lg, y + run); const z = Math.max(3, (ye - y0) * tp - 8);
      S.box(-w / 2 + par, y, 0, w / 2 - par, ye, z, { mat: hr.stone });
    }
    // quadrants: quarter-cylinders about the gnomon edge (axis a), each side
    const R = 230, a = [0, cp, sp], d = [0, sp, -cp];
    const zc = R * cp + 14, yc = y0 + zc / tp, bw = 90, N = 36;
    for (const sg of [-1, 1]) {
      const C = [sg * w / 2, yc, zc];
      const P = (t, s) => [C[0] + sg * R * Math.cos(t), C[1] + R * Math.sin(t) * d[1] + s * a[1], C[2] + R * Math.sin(t) * d[2] + s * a[2]];
      const Nn = (t) => nrm([-sg * Math.cos(t), -Math.sin(t) * d[1], -Math.sin(t) * d[2]]);
      for (let i = 0; i < N; i++) {
        const t0 = (i / N) * Math.PI / 2, t1 = ((i + 1) / N) * Math.PI / 2;
        S.slab([P(t0, -bw / 2), P(t1, -bw / 2), P(t1, bw / 2), P(t0, bw / 2)], 0, { mat: hr.stone });
        const nn = Nn((t0 + t1) / 2);
        S.decal([P(t0, bw / 2 - 14), P(t1, bw / 2 - 14), P(t1, bw / 2 - 4), P(t0, bw / 2 - 4)], nn, hr.marble);
        S.decal([P(t0, -bw / 2 + 4), P(t1, -bw / 2 + 4), P(t1, -bw / 2 + 14), P(t0, -bw / 2 + 14)], nn, hr.marble);
      }
      for (let h = 1; h < 24; h++) {
        const t = (h / 24) * Math.PI / 2, ww = h % 4 === 0 ? 0.006 : 0.003, ln = h % 4 === 0 ? 14 : 30;
        S.decal([P(t - ww, -bw / 2 + ln), P(t + ww, -bw / 2 + ln), P(t + ww, bw / 2 - ln), P(t - ww, bw / 2 - ln)], Nn(t), hr.marble, 0.5);
      }
    }
    return { S, cam: CAM(0.92, 330) };
  };

  // A wall with one window — the context window
  SCENES.aperture = (hr) => {
    const S = new Scene(); ground(S, hr);
    const xw = 60, t = 70, Hh = 420, Y0 = 60, Y1 = 900, wy0 = 330, wy1 = 470, wz0 = 150, wz1 = 290;
    S.box(xw, Y0, 0, xw + t, wy0, Hh, { mat: hr.stone });
    S.box(xw, wy1, 0, xw + t, Y1, Hh, { mat: hr.stone });
    S.box(xw, wy0, 0, xw + t, wy1, wz0, { mat: hr.stone });
    S.box(xw, wy0, wz1, xw + t, wy1, Hh, { mat: hr.stone });
    for (let i = 0; i < 16; i++) { const y = 70 + i * 48; S.box(-150, y, 0, -122, y + 28, 28, { mat: hr.marble }); }
    return { S, cam: CAM(1, 470, true) };
  };

  // Field of gnomons — parallel instruments
  SCENES.field = (hr) => {
    const S = new Scene(); ground(S, hr);
    for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
      const x = -330 + c * 150, y = 120 + r * 190;
      S.extrude([[x, y, 0], [x + 100, y, 0], [x + 100, y, 92]], [0, 34, 0], { mat: hr.stone });
    }
    return { S, cam: CAM(1, 300) };
  };

  // Stair to the sky — autoregression
  SCENES.stair = (hr) => {
    const S = new Scene(); ground(S, hr);
    const n = 14, run = 42, rise = 34, y0 = 160, y1 = 290;
    for (let i = 0; i < n; i++) S.box(-340 + i * run, y0, 0, -340 + (i + 1) * run, y1, (i + 1) * rise, { mat: hr.stone });
    return { S, cam: CAM(1, 360) };
  };

  // ---------- books ----------
  const BOOKS = [
    { slug: 'mathematical-foundations-for-ml', title: ['Mathematical', 'Foundations for', 'Machine Learning'], level: 'beginner', capsules: 43, hours: 10, scene: 'samrat', fig: 'After the Samrat Yantra, Jaipur, 1734' },
    { slug: 'ai-context-engineering', title: ['AI Context', 'Engineering'], level: 'intermediate', capsules: 43, hours: 10, scene: 'aperture', fig: 'A roof with one opening' },
    { slug: 'build-llms-from-scratch', title: ['Build Large Language', 'Models (LLMs)', 'from Scratch'], level: 'intermediate', capsules: 20, hours: 6, scene: 'stair', fig: 'A stair built one step at a time' },
    { slug: '5d-parallelism', title: ['5D Parallelism', 'for Large Model', 'Training'], level: 'advanced', capsules: 40, hours: 9, scene: 'field', fig: 'A field of identical gnomons' },
  ];

  // ---------- marks ----------
  function mark(col) { // Vizuara stepwell mark: an inverted stepped V
    const r = [[0, 26], [4, 18], [8, 10], [12, 2]]; // [y, width]
    return `<svg class="mk" width="26" height="18" viewBox="0 0 26 18"><path fill="${col}" d="${r.map(([y, w]) => `M${(26 - w) / 2} ${y}h${w}v4.2h-${w}z`).join('')}"/></svg>`;
  }
  function levelGlyph(n, col) {
    let s = ''; for (let i = 0; i < 3; i++) { const h = 5 + i * 4.5, x = i * 9; s += i < n ? `<rect x="${x}" y="1" width="7.5" height="${h}" fill="${col}"/>` : `<rect x="${x + 0.6}" y="1.6" width="6.3" height="${h - 1.2}" fill="none" stroke="${col}" stroke-width="1.2"/>`; }
    return `<svg class="lv" width="26" height="16" viewBox="0 0 26 16">${s}</svg>`;
  }

  function build(b) {
    const hr = HOURS[b.level];
    const { S, cam } = SCENES[b.scene](hr);
    const art = render(S, cam, hr.L);
    const el = document.createElement('div');
    el.className = 'cover lv-' + b.level; el.dataset.slug = b.slug;
    el.style.setProperty('--sky', hr.sky); el.style.setProperty('--ink', hr.ink); el.style.setProperty('--sub', hr.sub);
    el.innerHTML = `<svg class="art" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="${hr.sky}"/>${art}</svg>
      <h2 class="title">${b.title.join('<br>')}</h2>
      <div class="band">
        <div class="row r1"><span class="imp">${mark('#F4EADC')}<b>Vizuara</b> Books</span><span class="lvl">${levelGlyph(hr.n, '#F4EADC')}${hr.label}</span></div>
        <div class="row r2"><span>${b.capsules} capsules · ${b.hours} hours</span><span class="fig">${b.fig}</span></div>
      </div>`;
    return el;
  }

  window.JANTAR = { BOOKS, build, HOURS };
})();
</script>
<script>const host=document.getElementById('covers');for(const b of JANTAR.BOOKS)host.appendChild(JANTAR.build(b));</script>
</body></html>
