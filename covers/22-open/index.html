<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textmode — Vizuara Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root { --page:#f1efe9; --pageInk:#1d1c1a; --rule:#cfcac0; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--page); color:var(--pageInk); }
  body { font:16px/1.5 'JetBrains Mono', ui-monospace, monospace; }

  /* ---------------- the cover ---------------- */
  .cover { position:relative; width:720px; height:888px; overflow:hidden; flex:none;
           background:var(--ground); color:var(--B); }
  .cover svg.field { position:absolute; left:0; top:0; width:720px; height:888px; display:block; }
  .cover .imprint { position:absolute; left:36px; right:36px; top:30px; height:24px;
           display:flex; align-items:center; justify-content:space-between;
           font:700 11px/1 'JetBrains Mono', monospace; letter-spacing:.14em; text-transform:uppercase; }
  .cover .imprint .brand { display:flex; align-items:center; gap:10px; }
  .cover .imprint svg { display:block; }
  .cover .imprint .lvl { display:flex; align-items:center; gap:10px; }
  .cover .meter { display:flex; gap:2px; }
  .cover .meter i { display:block; width:6px; height:12px; border:1.25px solid var(--B); }
  .cover .meter i.on { background:var(--B); }
  .cover h1.title { position:absolute; left:36px; right:30px; top:var(--ty,78px); margin:0;
           font-family:'Fraunces', serif; font-weight:640; font-size:var(--ts,96px);
           line-height:var(--tl,.98); letter-spacing:-.022em; color:var(--B);
           font-variation-settings:'opsz' 144, 'SOFT' 0, 'WONK' 0; font-optical-sizing:none; }
  .cover h1.title span.l { display:block; width:max-content; white-space:nowrap; }
  .cover h1.title .soft { font-weight:420; font-style:italic; }
  .cover h1.title .cur { display:inline-block; width:.42em; height:.70em; margin-left:.07em;
           background:var(--A); vertical-align:-.02em; }
  .cover .sub { position:absolute; left:36px; right:36px; margin:0;
           font:italic 400 19px/1.3 'Fraunces', serif; font-variation-settings:'opsz' 24; color:var(--B); }
  .cover .foot { position:absolute; left:36px; right:36px; bottom:30px; height:24px;
           display:flex; align-items:center; justify-content:space-between;
           font:500 11px/1 'JetBrains Mono', monospace; letter-spacing:.06em; }
  .cover .foot .cap { text-transform:none; }
  .cover .foot .meta { text-transform:uppercase; letter-spacing:.14em; font-weight:700; }

  /* ---------------- presentation page ---------------- */
  .wrapall { max-width:1560px; margin:0 auto; padding:64px 48px 120px; }
  .covers { display:flex; flex-wrap:wrap; gap:56px 48px; margin-top:40px; }
  .covers figure { margin:0; }
  .covers figcaption { margin-top:12px; font-size:12px; color:#5e5a52; }
</style>
</head>
<body>
<div class="wrapall">
  <header id="intro"></header>
  <section class="covers" id="covers"></section>
</div>

<script>
/* =====================================================================
   TEXTMODE — engine
   Every cover is a 120 x 74 grid of 6 x 12 px character cells (720 x 888).
   Emblems are drawn into the grid as characters, then written out as SVG
   text with an explicit x for every glyph, so alignment never depends on
   font metrics.
   ===================================================================== */
const CW = 6, CH = 12, COLS = 120, ROWS = 74, W = 720, H = 888;
const RAMP = ' .:-=+*#%@';

/* ---------- colour ---------- */
function oklch(L, C, h) {
  const hr = h * Math.PI / 180, a = C * Math.cos(hr), b = C * Math.sin(hr);
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
  const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
  const rgb = [ 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
               -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
               -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
  const enc = (x) => { x = Math.max(0, Math.min(1, x)); return x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055; };
  return '#' + rgb.map((v) => Math.round(enc(v) * 255).toString(16).padStart(2, '0')).join('');
}
function mixHex(a, b, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

/* Families: hue = shelf (subject). Each family is three inks: paper, vivid, deep. */
const FAM = {
  found:   { label: 'Foundations',          h: 258, paper: [.955, .018], vivid: [.60, .14],  deep: [.27, .085] },
  lang:    { label: 'Language models',      h: 34,  paper: [.955, .022], vivid: [.65, .175], deep: [.28, .085] },
  vision:  { label: 'Vision & multimodal',  h: 305, paper: [.955, .020], vivid: [.60, .13],  deep: [.26, .075] },
  sys:     { label: 'Systems & scale',      h: 212, paper: [.955, .015], vivid: [.64, .085], deep: [.27, .045] },
  agents:  { label: 'Agents & context',     h: 152, paper: [.955, .025], vivid: [.67, .12],  deep: [.28, .055] },
  rl:      { label: 'RL & robotics',        h: 82,  paper: [.96,  .030], vivid: [.74, .135], deep: [.30, .045] },
  code:    { label: 'Code & data',          h: 95,  paper: [.95,  .006], vivid: [.68, .010], deep: [.25, .006] },
  factory: { label: 'The Intelligence Factory', h: 58, paper: [.95, .025], vivid: [.62, .085], deep: [.26, .04] },
};
for (const k in FAM) { const f = FAM[k]; f.P = oklch(f.paper[0], f.paper[1], f.h); f.V = oklch(f.vivid[0], f.vivid[1], f.h); f.D = oklch(f.deep[0], f.deep[1], f.h); }

/* Level picks which of the three inks is the ground. A = the other colourful ink, B = max contrast. */
function inksFor(famKey, level) {
  const f = FAM[famKey];
  if (level === 'beginner')     return { ground: f.P, A: f.V, B: f.D, faint: mixHex(f.P, f.D, .16), dark: false };
  if (level === 'intermediate') return { ground: f.V, A: f.P, B: f.D, faint: mixHex(f.V, f.D, .24), dark: false };
  return                               { ground: f.D, A: f.V, B: f.P, faint: mixHex(f.D, f.P, .17), dark: true };
}

/* ---------- grid ---------- */
// ink ids: 1 = A (vivid/second ink), 2 = B (contrast), 3 = faint, 4 = ground (knock-out)
class Grid {
  constructor(dark) { this.n = COLS * ROWS; this.ch = new Array(this.n).fill(''); this.ink = new Uint8Array(this.n);
    this.bg = new Uint8Array(this.n); this.wt = new Uint8Array(this.n); this.dark = dark; this.tiles = []; }
  /* a solid tile (inverse video) drawn under the glyphs, inset so neighbours stay separate */
  tile(c, r, w, h, ink, inset = 1) { this.tiles.push({ c, r, w, h, ink, inset }); }
  i(c, r) { return (c < 0 || r < 0 || c >= COLS || r >= ROWS) ? -1 : r * COLS + c; }
  put(c, r, ch, ink = 2, bg = 0, wt = 0) { const i = this.i(c | 0, r | 0); if (i < 0) return;
    this.ch[i] = ch; this.ink[i] = ink; this.bg[i] = bg; this.wt[i] = wt; }
  get(c, r) { const i = this.i(c, r); return i < 0 ? '' : this.ch[i]; }
  text(c, r, s, ink = 2, bg = 0, wt = 0) { [...s].forEach((ch, k) => this.put(c + k, r, ch, ink, bg, wt)); }
  block(c, r, w, h, bgInk, ch = '', ink = 4) { for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) this.put(x, y, ch, ink, bgInk); }
  clear(c, r, w = 1, h = 1) { for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) { const i = this.i(x, y); if (i >= 0) { this.ch[i] = ''; this.bg[i] = 0; } } }
  empty(c, r) { const i = this.i(c, r); return i >= 0 && !this.ch[i] && !this.bg[i]; }
}
const cx = (c) => c * CW + CW / 2, cy = (r) => r * CH + CH / 2;
const colOf = (x) => Math.floor(x / CW), rowOf = (y) => Math.floor(y / CH);

/* choose a glyph for a line passing through a cell */
function slopeChar(dx, dy, fy) {
  const a = Math.abs(Math.atan2(dy, dx) * 180 / Math.PI), t = a > 90 ? 180 - a : a;
  if (t < 24) return fy < 0.30 ? '¯' : fy > 0.70 ? '_' : '-';
  if (t > 70) return '|';
  return (dx * dy > 0) ? '\\' : '/';
}
/* straight line in px, drawn with slope-aware characters */
function line(g, x0, y0, x1, y1, ink = 2, opt = {}) {
  const dx = x1 - x0, dy = y1 - y0, ch = opt.ch, skip = opt.skipFilled, wt = opt.wt || 0;
  const plot = (c, r, fy) => { if (skip && !g.empty(c, r)) return; g.put(c, r, ch || slopeChar(dx, dy, fy), ink, 0, wt); };
  if (Math.abs(dx) / CW >= Math.abs(dy) / CH) {
    const c0 = colOf(Math.min(x0, x1)), c1 = colOf(Math.max(x0, x1));
    for (let c = c0; c <= c1; c++) { const x = cx(c); const y = dx === 0 ? y0 : y0 + (x - x0) * dy / dx;
      const r = rowOf(y); plot(c, r, (y - r * CH) / CH); }
  } else {
    const r0 = rowOf(Math.min(y0, y1)), r1 = rowOf(Math.max(y0, y1));
    for (let r = r0; r <= r1; r++) { const y = cy(r); const x = x0 + (y - y0) * dx / dy; plot(colOf(x), r, .5); }
  }
}
function polyline(g, pts, ink = 2, opt = {}) { for (let k = 0; k < pts.length - 1; k++) line(g, pts[k][0], pts[k][1], pts[k + 1][0], pts[k + 1][1], ink, opt); }

/* supersampled coverage of a cell by an inside(x,y) predicate */
function coverage(inside, c, r, sx = 3, sy = 5) {
  let n = 0; const x0 = c * CW, y0 = r * CH;
  for (let j = 0; j < sy; j++) for (let i = 0; i < sx; i++) if (inside(x0 + (i + .5) * CW / sx, y0 + (j + .5) * CH / sy)) n++;
  return n / (sx * sy);
}
/* fill a shape. chars: string (cycled in reading order) | function(c,r,cov,k) | null (ramp by coverage) */
function fill(g, inside, box, ink = 2, chars = null, opt = {}) {
  const [x0, y0, x1, y1] = box, th = opt.th ?? .5; let k = 0;
  for (let r = rowOf(y0); r <= rowOf(y1); r++) for (let c = colOf(x0); c <= colOf(x1); c++) {
    const cov = coverage(inside, c, r); if (cov < th) continue;
    let ch;
    if (typeof chars === 'string') ch = chars[k % chars.length];
    else if (typeof chars === 'function') ch = chars(c, r, cov, k);
    else ch = RAMP[Math.max(1, Math.round(cov * (RAMP.length - 1)))];
    k++;
    if (ch === null || ch === undefined) continue;
    if (ch === ' ') { if (opt.clearSpace) g.clear(c, r); continue; }
    g.put(c, r, ch, opt.inkAt ? opt.inkAt(c, r, cov) : ink, opt.bg || 0, opt.wt || 0);
  }
}
/* density (0..1) -> glyph */
const dens = (v, ramp = RAMP) => ramp[Math.max(0, Math.min(ramp.length - 1, Math.round(v * (ramp.length - 1))))];

/* tiny seeded RNG so every cover is reproducible */
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- 3D: a small sphere-tracer that returns a shade per cell ---------- */
const V3 = { add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s], dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; } };
function rotY(p, a) { const c = Math.cos(a), s = Math.sin(a); return [c * p[0] + s * p[2], p[1], -s * p[0] + c * p[2]]; }
function rotX(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0], c * p[1] - s * p[2], s * p[1] + c * p[2]]; }
function sdBox(p, b) { const q = [Math.abs(p[0]) - b[0], Math.abs(p[1]) - b[1], Math.abs(p[2]) - b[2]];
  return Math.hypot(Math.max(q[0], 0), Math.max(q[1], 0), Math.max(q[2], 0)) + Math.min(Math.max(q[0], Math.max(q[1], q[2])), 0); }
/* march an orthographic camera. scene(p) -> [dist, id]. returns per-cell {hit,n,p,id} via callback */
function trace(g, box, scene, cam, shadeFn) {
  const [x0, y0, x1, y1] = box, mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  for (let r = rowOf(y0); r <= rowOf(y1); r++) for (let c = colOf(x0); c <= colOf(x1); c++) {
    const sx = (cx(c) - mx) / cam.scale, sy = -(cy(r) - my) / cam.scale;
    let ro = [sx, sy, -50], rd = [0, 0, 1];
    ro = rotY(rotX(ro, cam.pitch), cam.yaw); rd = rotY(rotX(rd, cam.pitch), cam.yaw);
    let t = 0, hit = null;
    for (let s = 0; s < 160; s++) { const p = V3.add(ro, V3.mul(rd, t)); const [d, id] = scene(p);
      if (d < 1e-3) { hit = { p, id }; break; } t += d; if (t > 120) break; }
    if (!hit) continue;
    const e = 1e-3, p = hit.p;
    const n = V3.norm([scene([p[0] + e, p[1], p[2]])[0] - scene([p[0] - e, p[1], p[2]])[0],
                       scene([p[0], p[1] + e, p[2]])[0] - scene([p[0], p[1] - e, p[2]])[0],
                       scene([p[0], p[1], p[2] + e])[0] - scene([p[0], p[1], p[2] - e])[0]]);
    shadeFn(c, r, { p, n, id: hit.id, rd });
  }
}

/* ---------- SVG out ---------- */
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function gridSVG(g, K) {
  const col = { 1: K.A, 2: K.B, 3: K.faint, 4: K.ground };
  let out = '';
  for (const t of g.tiles) out += `<rect x="${t.c * CW + t.inset}" y="${t.r * CH + t.inset}" width="${t.w * CW - 2 * t.inset}" height="${t.h * CH - 2 * t.inset}" fill="${col[t.ink]}"/>`;
  // inverse-video backgrounds: one rect per horizontal run
  for (let r = 0; r < ROWS; r++) { let c = 0;
    while (c < COLS) { const b = g.bg[r * COLS + c]; if (!b) { c++; continue; }
      let e = c; while (e + 1 < COLS && g.bg[r * COLS + e + 1] === b) e++;
      out += `<rect x="${c * CW}" y="${r * CH}" width="${(e - c + 1) * CW}" height="${CH}" fill="${col[b]}"/>`; c = e + 1; } }
  // glyphs: one <text> per row per ink per weight, each glyph individually positioned
  for (let r = 0; r < ROWS; r++) { const groups = {};
    for (let c = 0; c < COLS; c++) { const i = r * COLS + c, ch = g.ch[i]; if (!ch || ch === ' ') continue;
      const key = g.ink[i] + '_' + g.wt[i]; (groups[key] = groups[key] || { xs: [], s: '' }); groups[key].xs.push(c * CW); groups[key].s += ch; }
    for (const key in groups) { const [ink, wt] = key.split('_').map(Number); const gr = groups[key];
      out += `<text x="${gr.xs.join(' ')}" y="${r * CH + 9.5}" fill="${col[ink]}"${wt ? ` font-weight="${wt}"` : ''}>${esc(gr.s)}</text>`; } }
  return out;
}
</script>

<script>
/* =====================================================================
   EMBLEMS — one per book, each drawn from the book's actual mechanism.
   Zone: x 36..684, y 372..804 (cols 6..113, rows 31..66) unless noted.
   ===================================================================== */
const Z = { x0: 36, y0: 372, x1: 684, y1: 804 };
const EMBLEMS = {};

/* Neural Networks from Scratch — a 3-4-4-2 perceptron; neurons are tiles holding activations, one forward pass lit */
EMBLEMS['neural-networks-from-scratch'] = (g) => {
  const layers = [3, 4, 4, 2], cols = [14, 44, 74, 104], gapR = 7, midR = 49, rnd = rng(5);
  const act = [[.8, .1, .5], [.62, .07, .91, .33], [.18, .74, .96, .41], [.88, .12]];
  const pos = layers.map((n, li) => Array.from({ length: n }, (_, k) => [cols[li], Math.round(midR + (k - (n - 1) / 2) * gapR)]));
  const path = [0, 2, 2, 0];
  const ctr = ([c, r]) => [c * CW, r * CH + CH / 2];
  // edges: faint dotted for all, solid for the lit pass
  for (let li = 0; li < 3; li++) for (const [ia, a] of pos[li].entries()) for (const [ib, b] of pos[li + 1].entries()) {
    const lit = path[li] === ia && path[li + 1] === ib; const A = ctr(a), B = ctr(b);
    const w = rnd();
    if (!lit) line(g, A[0] + 24, A[1], B[0] - 24, B[1], w > .6 ? 1 : 3, { ch: w > .6 ? ':' : '·', wt: 700 });
  }
  for (let li = 0; li < 3; li++) { const A = ctr(pos[li][path[li]]), B = ctr(pos[li + 1][path[li + 1]]);
    line(g, A[0] + 24, A[1], B[0] - 24, B[1], 2, { wt: 800 }); }
  pos.forEach((layer, li) => layer.forEach(([c, r], k) => {
    const lit = path[li] === k, v = act[li][k];
    g.clear(c - 4, r - 1, 8, 3);
    g.tile(c - 3, r - 1, 6, 3, lit ? 2 : 1, 1);
    g.text(c - 2, r, v.toFixed(2).slice(1), lit ? 4 : 2, 0, 700);
  }));
  pos[0].forEach(([c, r], k) => g.text(c - 8, r, 'x' + (k + 1), 2, 0, 500));
  pos[3].forEach(([c, r], k) => g.text(c + 5, r, 'y' + (k + 1), 2, 0, 500));
  // layer names under the columns
  ['input', 'hidden', 'hidden', 'output'].forEach((t, li) => g.text(cols[li] - Math.floor(t.length / 2), 66, t, 3, 0, 500));
};

/* Build LLMs from Scratch — a 12-token causal attention mask, weights printed in the cells */
EMBLEMS['build-llms-from-scratch'] = (g) => {
  const toks = ['The', 'model', 'reads', 'one', 'token', 'at', 'a', 'time', 'and', 'writes', 'the', 'next'];
  const N = 12, bw = 6, bh = 3, c0 = 30, r0 = 31, rnd = rng(7);
  for (let i = 0; i < N; i++) {
    // plausible causal weights: recency + a few long-range heads, softmaxed
    const s = []; for (let j = 0; j <= i; j++) s.push(-(i - j) * .45 + (j === 0 ? 1.2 : 0) + rnd() * 1.6);
    const m = Math.max(...s), e = s.map((v) => Math.exp(v - m)), z = e.reduce((a, b) => a + b, 0), w = e.map((v) => v / z);
    g.text(c0 - 2 - toks[i].length, r0 + i * bh + 1, toks[i], 2, 0, 500);
    for (let j = 0; j < N; j++) {
      const c = c0 + j * bw, r = r0 + i * bh;
      if (j > i) { g.put(c + 2, r + 1, '·', 3); continue; }
      const val = w[j], txt = val >= .995 ? '1.0' : val.toFixed(2).slice(1);
      if (val >= .28) { g.tile(c, r, bw - 1, bh, 2, 1.5); g.text(c + 1, r + 1, txt, 4, 0, 700); }
      else if (val >= .10) { g.tile(c, r, bw - 1, bh, 1, 1.5); g.text(c + 1, r + 1, txt, 2, 0, 700); }
      else g.text(c + 1, r + 1, txt, 2, 0, 500);
    }
  }
  // the prediction: next token falls out of the last row
  const rl = r0 + (N - 1) * bh + 1;
  g.text(c0 + N * bw + 1, rl, '->', 2, 0, 700); g.tile(c0 + N * bw + 4, rl - 1, 7, 3, 2, 1.5); g.text(c0 + N * bw + 5, rl, 'token', 4, 0, 700);
};

/* 5D Parallelism — the device mesh as a cube of 3x3x3 cubelets, seams left open; one pipeline stage lit */
EMBLEMS['5d-parallelism'] = (g) => {
  const N = 3, seam = .07;
  const scene = (p) => [sdBox(p, [1, 1, 1]), 0];
  const q = (u) => (u + 1) / 2 * N;               // -1..1 -> 0..N
  const onSeam = (u) => { const t = q(u); return Math.abs(t - Math.round(t)) < seam * N / 2 && Math.round(t) > 0 && Math.round(t) < N; };
  trace(g, [120, 360, 600, 816], scene, { scale: 150, yaw: Math.PI / 4, pitch: 0.6155 }, (c, r, h) => {
    const [x, y, z] = h.p, n = h.n;
    let face, u, v;
    if (n[1] > .5) { face = 0; u = x; v = z; } else if (Math.abs(n[0]) > Math.abs(n[2])) { face = 1; u = z; v = y; } else { face = 2; u = x; v = y; }
    if (onSeam(u) || onSeam(v)) return;
    const lit = Math.floor(q(y - 1e-6)) === 2 || (face === 0);     // the top layer: one pipeline stage
    const ch = face === 0 ? '#' : face === 1 ? '=' : ':';
    g.put(c, r, ch, lit ? 2 : 1, 0, 800);
  });
};

function markSVG(fg, bgc, h = 22) {
  const w = h * .6;
  return `<svg width="${w}" height="${h}" viewBox="0 0 12 20" aria-label="Vizuara"><rect width="12" height="20" fill="${fg}"/>` +
    `<path d="M2.2 4.2h2.5L6 11.2l1.3-7h2.5L7.4 15.8H4.6z" fill="${bgc}"/></svg>`;
}
const LEVELN = { beginner: 1, intermediate: 2, advanced: 3 };
function buildCover(b) {
  const K = inksFor(b.fam, b.level);
  const g = new Grid(K.dark);
  (EMBLEMS[b.slug] || (() => {}))(g, K, b);
  const el = document.createElement('div');
  el.className = 'cover'; el.dataset.slug = b.slug;
  el.style.cssText = `--ground:${K.ground};--A:${K.A};--B:${K.B};--faint:${K.faint}`;
  const lv = LEVELN[b.level];
  const lines = b.lines.map((l, i) => `<span class="l">${l}${i === b.lines.length - 1 ? '<span class="cur"></span>' : ''}</span>`).join('');
  el.innerHTML =
    `<svg class="field" viewBox="0 0 720 888" font-family="JetBrains Mono" font-size="10">${gridSVG(g, K)}</svg>` +
    `<div class="imprint"><div class="brand">${markSVG(K.B, K.ground)}<span>Vizuara Books</span></div>` +
    `<div class="lvl"><span>${b.level}</span><span class="meter">${[1, 2, 3].map((i) => `<i class="${i <= lv ? 'on' : ''}"></i>`).join('')}</span></div></div>` +
    `<h1 class="title">${lines}</h1>` +
    (b.sub ? `<p class="sub">${b.sub}</p>` : '') +
    `<div class="foot"><span class="cap">${b.fig || ''}</span><span class="meta">${b.capsules ? `${b.capsules} capsules · ${b.hours} h` : 'coming soon'}</span></div>`;
  return el;
}
function fitTitle(el, b) {
  const h1 = el.querySelector('h1.title'); const maxW = 648, maxH = b.maxH || 270;
  let size = b.size || 104; h1.style.setProperty('--ts', size + 'px');
  const widest = () => Math.max(...[...h1.querySelectorAll('span.l')].map((s) => s.getBoundingClientRect().width));
  for (let k = 0; k < 4; k++) { const w = widest(), h = h1.getBoundingClientRect().height;
    const f = Math.min(maxW / w, maxH / h, 1); if (f > .995) break; size = Math.floor(size * f); h1.style.setProperty('--ts', size + 'px'); }
  const sub = el.querySelector('.sub'); if (sub) sub.style.top = (78 + h1.getBoundingClientRect().height + 14) + 'px';
}
